name: refresh

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install -q curl_cffi

      - name: refrescar precios
        run: python scraper.py

      - name: publicar si hubo cambios
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios de precios: no se publica commit."
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  probe-waf:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar camoufox
        run: |
          pip install -q camoufox
          python -m camoufox fetch
      - name: sondear WAF DataDome
        run: python probe_waf.py
