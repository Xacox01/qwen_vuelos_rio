name: refresh

# Cron unificado al MENOR intervalo (pedido del dueño, Task 26): igual que
# vuelos-rio-live, */5. Los escaneos pesados siguen gated internamente
# (OTAS_GAP, cupones 6 h, WARP solo cuando vence), así que el costo real es
# bajo y ambos sitios sincronizan con la misma cadencia.
on:
  schedule:
    - cron: "*/5 * * * *"   # recaptura cada 5 min (unificado con vuelos-rio-live)
  workflow_dispatch: {}
  push:
    paths:
      - 'data.json'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 40 min (antes 28): con el dato publicado viejo, WARP y cupones se fuerzan
    # cada ciclo (+6 min) y el job moría crónicamente a los 28 — espiral de la
    # que no salía sola (diagnóstico 2026-11-09). Headroom para el régimen lento.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-browser-v156

      - uses: actions/cache@v4
        with:
          path: ~/.warp
          key: warp-device-v1

      - name: dependencias
        run: |
          pip install -q "camoufox[geoip]" curl_cffi
          python -m camoufox fetch || (python -m camoufox sync && python -m camoufox fetch) || echo "::warning::camoufox no disponible, se usará fallback SSR"

      - name: activar WARP (egress IP consumidor para OTAs/DataDome)
        run: |
          # Levantar el túnel si el escaneo OTA vence, o si queda cobertura one-way
          # de playas pendiente (el WAF de Cocha rechaza con 403 la ruta directa
          # del runner — las queries one-way solo pueden salir por WARP).
          DUE=$(python3 -c '
          import json, datetime, os
          try:
              d = json.load(open("data.json"))
              t = datetime.datetime.strptime(str(d.get("ota_ts",""))[:19], "%Y-%m-%d %H:%M:%S")
              gap = int(os.environ.get("OTAS_GAP", "1800"))
              due = (datetime.datetime.now() - t).total_seconds() >= gap
          except Exception:
              due = True
          try:
              DESTS = ("GIG","FLN","SSA","REC","FOR","MCZ","NAT","BPS","CTG","ADZ",
                       "PUJ","CUN","HAV","LIR","SJO","PTY")
              ow = ((d.get("fuentes") or {}).get("playas") or {}).get("one_way") or {}
              # pendiente = destino sin key O con algún sentido vacío
              pend = [k for k in DESTS if not isinstance(ow.get(k), dict)
                      or not (ow[k].get("SCL-" + k) and ow[k].get(k + "-SCL"))]
              due = due or bool(pend)
          except Exception:
              pass
          print("yes" if due else "no")
          ')
          if [ "$DUE" != "yes" ]; then
            echo "Escaneo OTA no vence este ciclo — WARP omitido"
            exit 0
          fi
          chmod +x warp_boot.sh
          timeout 260 bash warp_boot.sh || echo "::warning::bootstrap WARP excedió tiempo"
          echo "WARP_OK=${WARP_OK:-0}"

      - name: refrescar precios
        env:
          OTAS_GAP: "1800"
          OTA_PROXY: ${{ env.OTA_PROXY }}
        run: |
          timeout 1400 python3 scraper.py || {
            echo "::error::[refresh] scraper.py falló o excedió 1400s (rc=$?) — no se publica este ciclo"
            exit 1
          }

      - name: refrescar cupones (gate 6 h)
        run: |
          DUE=$(python3 -c '
          import json, datetime
          try:
              d = json.load(open("data.json"))
              t = datetime.datetime.strptime(str((d.get("cupones") or {}).get("ts",""))[:19], "%Y-%m-%d %H:%M:%S")
              due = (datetime.datetime.now() - t).total_seconds() >= 21600
          except Exception:
              due = True
          print("yes" if due else "no")
          ')
          if [ "$DUE" = "yes" ]; then
            python3 fetch_coupons.py || echo "::warning::fetch de cupones falló (se conserva el último dato)"
          else
            echo "Cupones vigentes (menos de 6 h) — omitido"
          fi

      - name: asegurar bus de suscripciones (auto-rotante; cada repo su propio bus)
        run: |
          python3 bus_alertas.py || echo "::warning::rotación de bus falló (no bloquea publicación; verify y auto-reparación lo cubren)"

      - name: procesar suscripciones de alertas (cifrado, privacy-first)
        env:
          ALERT_RSA_PRIV: ${{ secrets.ALERT_RSA_PRIV }}
        run: |
          pip install -q cryptography || true
          python3 notificaciones.py || echo "::warning::notificaciones falló (no bloquea publicación)"

      - name: enviar-alertas-email (destinatarios descifrados en memoria, correos enmascarados en logs)
        env:
          ALERT_RSA_PRIV: ${{ secrets.ALERT_RSA_PRIV }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 send_alerts.py || true

      - name: subir diagnóstico OTA (si hubo challenge)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ota-diag-${{ github.run_number }}
          path: ota_diag/
          retention-days: 5
          if-no-files-found: ignore

      - name: verificar sitio (GATE de publicación — corta el despliegue si algo falla)
        id: verify
        run: |
          node verify.js index.html data.json || { 
            echo "::error::verify.js FALLÓ — no se publica data.json/index hasta corregir. Revisa los checks arriba." 
            exit 1
          }

      - name: publicar si hubo cambios (solo si verificación OK)
        if: always() && steps.verify.outcome == 'success'
        run: |
          git config core.fileMode false
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data.json subscribers.enc.json estado_alertas.json alertas.cfg.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no se publica commit."
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git remote set-url origin "https://Xacox01:${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git"
            OK=0
            for i in 1 2 3 4 5; do
              if git push; then OK=1; echo "push OK (intento $i)"; break; fi
              echo "push rechazado (intento $i) — rebase sobre origin/main y reintento"
              git pull --rebase --autostash || git rebase --abort || true
              sleep 10
            done
            if [ "$OK" != "1" ]; then
              echo "::error::push rechazado tras 5 intentos (colisión con auditoría u otra cadena). El cron */5 re-recaptura y reintenta el próximo ciclo."
              exit 1
            fi
          fi

      - name: encadenar siguiente ciclo (~5 min)
        if: always()
        run: |
          sleep 120
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.PUSH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "auto-dispatch HTTP $CODE (intento $i)"
            if [ "$CODE" = "204" ] || [ "$CODE" = "202" ]; then break; fi
            if [ "$CODE" = "401" ]; then
              echo "::error::dispatch devolvio 401 (PUSH_TOKEN invalido o recien rotado). El cron cada 5 min retomara el ciclo — no se pierde nada."
              break
            fi
            sleep 15
          done
          if [ "$CODE" != "204" ] && [ "$CODE" != "202" ]; then
            echo "::warning::cadena no re-dispateada (HTTP $CODE). El cron */5 garantiza el proximo ciclo."
          fi
