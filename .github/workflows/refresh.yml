name: refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - 'data.json'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install -q curl_cffi

      - name: refrescar precios
        run: python scraper.py

      - name: publicar si hubo cambios
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no se publica commit."
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || true
            git remote set-url origin "https://Xacox01:${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git"
            git push
          fi

      - name: encadenar siguiente ciclo (~5 min)
        if: always()
        run: |
          sleep 240
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.PUSH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "auto-dispatch HTTP $CODE"
