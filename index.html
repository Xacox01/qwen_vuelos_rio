<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vuelos SCL⇄Río · EN VIVO · ene–feb 2027</title>
<style>
:root{--bg:#0f172a;--panel:#111c33;--line:#24334d;--txt:#e2e8f0;--mut:#94a3b8;--grn:#4ade80;--blu:#60a5fa;--tabs-h:52px}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#1e3a8a,#7c3aed);padding:14px 16px;position:sticky;top:0;z-index:10}
h1{margin:0 0 2px;font-size:clamp(1rem,4vw,1.3rem)}
.sub{opacity:.92;font-size:clamp(.72rem,2.6vw,.85rem)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{background:#052e16;border:1px solid #16a34a;color:#86efac;border-radius:20px;padding:3px 10px;font-size:.72rem;white-space:nowrap}
.badge.warn{background:#422006;border-color:#b45309;color:#fcd34d}
.badge.info{background:#1e293b;border-color:#334155;color:#cbd5e1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--panel);position:sticky;top:0;z-index:9;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.8rem}
nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
main{padding:10px 12px 60px;max-width:1100px;margin:0 auto}
section{display:none}section.on{display:block}
.ok,.warnbox{border-radius:10px;padding:10px 12px;font-size:.8rem;margin:10px 0;line-height:1.45}
.ok{background:#052e16;border:1px solid #166534}
.warnbox{background:#422006;border:1px solid #92400e}
.hero{background:#132a4a;border:1px solid #1d4ed8;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.88rem;line-height:1.5}
.hero b{color:var(--grn);font-size:1.05rem}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{flex:1 1 300px;margin:0;min-width:260px}
.big{font-size:1.7rem;font-weight:800;color:var(--grn);line-height:1.15}
.hero .btn{margin:6px 4px 0 0}
.tbl{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel);overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;min-width:560px}
th{background:#1e293b;text-align:left;padding:8px 9px;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#182742}
.p{color:var(--grn);font-weight:600;white-space:nowrap}
.b{color:var(--mut);font-size:.72rem}
a{color:var(--blu);text-decoration:none;white-space:nowrap}
.btn{display:inline-block;background:#16a34a;color:#fff!important;border-radius:7px;padding:5px 10px;font-weight:600;font-size:.75rem}
.btn.sky{background:#7c3aed}.btn.ggl{background:#1d4ed8}.btn.fal{background:#b45309}
h2{font-size:.95rem;margin:16px 0 4px}
input.filt{width:100%;margin:8px 0;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px 10px;color:var(--txt);font-size:.85rem}
.spin{display:inline-block;width:9px;height:9px;border:2px solid var(--grn);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:20px auto;max-width:560px;background:#422006;border:1px solid #92400e;border-radius:12px;padding:16px;font-size:.9rem}
@media (max-width:640px){
 table{min-width:520px;font-size:.76rem}
 th,td{padding:6px 7px}
 .hero{font-size:.82rem}
 main{padding:8px 8px 50px}
}
</style></head><body>
<div id="app">
 <div v-if="fatal" class="err">⚠️ No se pudo cargar el motor de la interfaz (Vue). Revisa tu conexión y recarga.</div>
 <template v-else>
 <header>
  <h1>✈️ SCL ⇄ Río de Janeiro · precios EN VIVO</h1>
  <div class="sub">ene–feb 2027 · regreso ≤ 23-feb · CLP pp · <span class="spin"></span>datos refrescados cada 5 min por GitHub Actions</div>
  <div class="badges">
   <span class="badge info">🔄 Verificado: {{DATA?.updated||'—'}}</span>
   <span class="badge info">💾 Último cambio de precios: {{DATA?.last_price_change||DATA?.updated||'—'}}</span>
   <span v-for="(v,k) in (DATA?.fuentes||{})" :key="k" class="badge" :class="{warn:!v.ok}">{{v.ok?'✅':'⚠️'}} {{NAMES[k]||k}}</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap"><span class="b">Pasajeros:</span><button v-for="n in PAXOPTS" :key="n" class="btn" :style="pax===n?'':'background:#1e293b;border:1px solid #334155'" @click="pax=n">{{n}}</button></div>
 </header>
 <nav>
  <button v-for="(t,i) in TABS" :key="i" :class="{on:cur===i}" @click="cur=i">{{t}}</button>
 </nav>
 <main>
  <!-- 0 Consolidado -->
  <section :class="{on:cur===0}">
   <div class="hero" v-if="campeon" style="text-align:center">
    <div class="b" style="letter-spacing:.12em">🏆 LA OPCIÓN MÁS BARATA ENCONTRADA AHORA (ida y vuelta, por persona)</div>
    <div class="big" style="font-size:2.2rem">{{fmt(campeon.total)}}</div>
    <div class="b">{{pax}} pasajeros ≈ <b style="font-size:.9rem">{{fmt(campeon.total*pax)}}</b> total grupo</div>
    <div style="margin:6px 0"><b style="color:var(--txt);font-size:.95rem">{{campeon.titulo}}</b></div>
    <div>{{dw(campeon.ida)}} {{campeon.ida}} → {{dw(campeon.vuelta)}} {{campeon.vuelta}} · {{campeon.noches}} noches</div>
    <div class="b" v-if="campeon.tipo==='mix'">Ida: {{campeon.ref.ida.det}} ({{fmt(campeon.ref.ida.clp)}}) · Vuelta: {{campeon.ref.vuelta.det}} ({{fmt(campeon.ref.vuelta.clp)}})</div>
    <div class="b" v-else>{{campeon.ref.det}} · fuente: {{campeon.ref.fuente}}</div>
    <div style="margin-top:8px"><a v-for="b in campeon.botones" :key="b.texto" class="btn" :class="b.cls" :href="b.href" target="_blank" rel="noopener">{{b.texto}}</a></div>
   </div>

   <div class="cards">
    <div class="card hero" v-if="rtPorAerolinea.length">
     <div class="b">✈️ MEJOR IDA+VUELTA · MISMA COMPAÑÍA</div>
     <div class="big">{{fmt(rtPorAerolinea[0].clp)}} <span class="b" style="font-size:.7rem">pp</span></div>
     <div><b style="color:var(--txt)">{{rtPorAerolinea[0].airline}}</b> · {{dw(rtPorAerolinea[0].ida)}} {{rtPorAerolinea[0].ida}} → {{dw(rtPorAerolinea[0].vuelta)}} {{rtPorAerolinea[0].vuelta}}</div>
     <div class="b">{{rtPorAerolinea[0].det}} · {{rtPorAerolinea[0].fuente}} · {{pax}} pax ≈ {{fmt(rtPorAerolinea[0].clp*pax)}}</div>
     <a class="btn" :class="rtPorAerolinea[0].cls" :href="rtPorAerolinea[0].link" target="_blank" rel="noopener">Comprar ↗</a>
    </div>
    <div class="card hero" v-if="mezclas">
     <div class="b">🔀 MEJOR MEZCLA ENTRE COMPAÑÍAS (compras por separado)</div>
     <div class="big">{{fmt(mezclas.total)}} <span class="b" style="font-size:.7rem">pp</span></div>
     <div>Ida <b style="color:var(--txt)">{{nomAer(mezclas.ida.cod)}}</b> {{dw(mezclas.ida.fecha)}} {{mezclas.ida.fecha}} · Vuelta <b style="color:var(--txt)">{{nomAer(mezclas.vuelta.cod)}}</b> {{dw(mezclas.vuelta.fecha)}} {{mezclas.vuelta.fecha}}</div>
     <div class="b">{{mezclas.ida.det}} ({{fmt(mezclas.ida.clp)}}) + {{mezclas.vuelta.det}} ({{fmt(mezclas.vuelta.clp)}}) · {{mezclas.noches}} noches · {{pax}} pax ≈ {{fmt(mezclas.total*pax)}}</div>
     <a class="btn" :class="mezclas.ida.cls" :href="mezclas.ida.link" target="_blank" rel="noopener">Comprar ida ↗</a>
     <a class="btn" :class="mezclas.vuelta.cls" :href="mezclas.vuelta.link" target="_blank" rel="noopener">Comprar vuelta ↗</a>
    </div>
   </div>

   <h2>🥇 Ranking ida y vuelta por compañía (la mejor opción de cada una, buscando en todas las fuentes)</h2>
   <div class="tbl"><table><tr><th>#</th><th>Compañía</th><th>Fechas</th><th>Detalle</th><th>CLP pp</th><th>{{pax}} pax</th><th>Fuente</th><th>Comprar</th></tr>
    <tr v-for="(r,i) in rtPorAerolinea" :key="r.cod"><td>{{i+1}}</td><td><b>{{r.airline}}</b></td><td>{{dw(r.ida)}} {{r.ida}} → {{dw(r.vuelta)}} {{r.vuelta}}</td><td class="b">{{r.det}}</td><td class="p"><b>{{fmt(r.clp)}}</b></td><td class="p">{{fmt(r.clp*pax)}}</td><td class="b">{{r.fuente}}</td><td><a class="btn" :class="r.cls" :href="r.link" target="_blank" rel="noopener">Ir ↗</a></td></tr>
   </table></div>

   <h2>📋 Lo mejor de cada portal/fuente (detalle)</h2>
   <div class="ok">🏅 <b>Lo mejor de cada empresa ahora mismo</b>, ordenado del más barato al más caro (por persona). Se recalcula solo cada ~5 min con el refresco automático.</div>
   <div class="tbl"><table><tr><th>#</th><th>Empresa</th><th>Mejor opción</th><th>Fechas</th><th>CLP pp</th><th>{{pax}} pax</th><th>Ir a comprar</th></tr>
    <tr v-for="(r,i) in consol" :key="r.emp"><td>{{i+1}}</td><td><b>{{r.emp}}</b><br><span class="b">{{r.tipo}}</span></td><td>{{r.det}}</td><td><template v-if="r.ida==='—'">fechas flexibles</template><template v-else>{{dw(r.ida)}} {{r.ida}} → {{dw(r.vuelta)}} {{r.vuelta}}</template></td><td class="p"><b>{{fmt(r.pp)}}</b></td><td class="p">{{fmt(r.pp*pax)}}</td><td><a class="btn" :class="r.cls" :href="r.link" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
   </table></div>
   <div class="warnbox">⚠️ Solo fuentes vivas: APIs oficiales (SKY/JetSMART/LATAM), cotización real de Cocha y metasearch Skiplagged. Las referencias OTA (Falabella/Despegar) entran únicamente si fueron verificadas en las últimas 24 h. La mezcla entre compañías son compras SEPARADAS: si un vuelo se retrasa y pierdes el otro, no hay protección de conexión — compárala con la opción de misma compañía. Confirma siempre en el checkout.</div>
  </section>
  <!-- 1 combos JetSMART -->
  <section :class="{on:cur===1}">
   <div class="ok">✅ <b>API oficial de disponibilidad JetSMART</b> — el botón verde abre el checkout real con esas fechas cargadas. Elige cuántos pasajeros cotizan: el precio pp se recalcula con la <b>asignación real de asientos por cubo de tarifa</b> (por eso 5 pax puede salir más caro que 1).</div>

   <div class="hero" v-if="combosPax.length">🏆 Mejor combinación para {{pax}} pax: <b>{{dw(combosPax[0].ida)}} {{combosPax[0].ida}} → {{dw(combosPax[0].vuelta)}} {{combosPax[0].vuelta}}</b> ({{combosPax[0].noches}} noches)<br>
    {{combosPax[0].v_ida}} + {{combosPax[0].v_vue}} · <b>{{fmt(combosPax[0].clp)}}</b> pp · total {{pax}} pax = <b>{{fmt(combosPax[0].tot??combosPax[0].clp*pax)}}</b>
    &nbsp;<a class="btn" :href="jsRT(combosPax[0].ida,combosPax[0].vuelta)" target="_blank" rel="noopener">Comprar ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>Vuelos</th><th>CLP pp ({{pax}} pax)</th><th>Total grupo</th><th>Comprar</th></tr>
    <tr v-for="c in combosPax.slice(0,14)" :key="c.ida+c.vuelta"><td>{{dw(c.ida)}} {{c.ida}} → {{dw(c.vuelta)}} {{c.vuelta}}</td><td>{{c.noches}}</td><td><b>{{c.v_ida}}</b> / <b>{{c.v_vue}}</b></td><td class="p">{{fmt(c.clp)}}</td><td class="p">{{fmt(c.tot??c.clp*pax)}}</td><td><a class="btn" :href="jsRT(c.ida,c.vuelta)" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 1 y 2 vuelos JetSMART -->
  <section :class="{on:cur===2}">
   <div class="ok">✅ API oficial JetSMART · ida SCL→GIG.</div>
   <input class="filt" v-model="fi" placeholder="Filtrar por fecha (ej: 2027-01-22 o 2027-01)">
   <div class="tbl"><table><tr><th>Fecha</th><th>Vuelo</th><th>Salida</th><th>Desde (pp)</th><th>Clases</th><th>Comprar</th></tr>
    <tr v-for="x in fI" :key="x.fecha+x.vuelo+x.hora"><td>{{dw(x.fecha)}} {{x.fecha}}</td><td><b>{{x.vuelo}}</b></td><td>{{x.hora}}</td><td class="p">{{fmt(x.clp)}}</td><td class="b">{{(x.buckets||[]).join(', ')}}</td><td><a class="btn" :href="jsOW(x.fecha,'SCL','GIG')" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
    <tr v-if="!fI.length"><td colspan="6">Sin resultados para ese filtro</td></tr>
   </table></div>
  </section>
  <section :class="{on:cur===3}">
   <div class="ok">✅ API oficial JetSMART · vuelta GIG→SCL.</div>
   <input class="filt" v-model="fv" placeholder="Filtrar por fecha (ej: 2027-02-01 o 2027-02)">
   <div class="tbl"><table><tr><th>Fecha</th><th>Vuelo</th><th>Salida</th><th>Desde (pp)</th><th>Clases</th><th>Comprar</th></tr>
    <tr v-for="x in fV" :key="x.fecha+x.vuelo+x.hora"><td>{{dw(x.fecha)}} {{x.fecha}}</td><td><b>{{x.vuelo}}</b></td><td>{{x.hora}}</td><td class="p">{{fmt(x.clp)}}</td><td class="b">{{(x.buckets||[]).join(', ')}}</td><td><a class="btn" :href="jsOW(x.fecha,'GIG','SCL')" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
    <tr v-if="!fV.length"><td colspan="6">Sin resultados para ese filtro</td></tr>
   </table></div>
  </section>
  <!-- 3 SKY -->
  <section :class="{on:cur===4}">
   <div class="ok">✅ <b>API oficial SKY</b> (histograma de skyairline.com) · RT 9–12 noches · mínimo oficial por fechas (1 adulto) · verificado {{sky.ts||'—'}}.<br>ℹ️ El botón <b>"Reservar estas fechas ↗"</b> abre SKY con tus fechas y pasajeros ya cargados. El precio de compra puede variar vs. el mínimo mostrado: depende de la familia tarifaria y de los asientos que queden (stock cambia rápido).</div>
   <div class="hero" v-if="sky.pairs?.length">🏆 Mejor tarifa SKY: <b>{{dw(sky.pairs[0].ida)}} {{sky.pairs[0].ida}} → {{dw(sky.pairs[0].vuelta)}} {{sky.pairs[0].vuelta}}</b> ({{sky.pairs[0].noches}} noches) · <b>{{fmt(sky.pairs[0].clp)}}</b> pp · {{pax}} pax ≈ <b>{{fmt(sky.pairs[0].clp*pax)}}</b> &nbsp;<a class="btn sky" :href="skyLink(sky.pairs[0])" target="_blank" rel="noopener">Reservar estas fechas ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>CLP pp</th><th>{{pax}} pax (est.)</th><th>Verificar</th></tr>
    <tr v-for="s in sky.pairs" :key="s.ida+s.vuelta"><td>{{dw(s.ida)}} {{s.ida}} → {{dw(s.vuelta)}} {{s.vuelta}}</td><td>{{s.noches}}</td><td class="p">{{fmt(s.clp)}}</td><td class="p">{{fmt(s.clp*pax)}}</td><td><a class="btn sky" :href="skyLink(s)" target="_blank" rel="noopener">Reservar estas fechas ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 4 LATAM oficial -->
  <section :class="{on:cur===5}">
   <div class="ok">✅ <b>API oficial web de LATAM</b> (calendario de latamairlines.com, solo directos). Combos = ida + vuelta.</div>
   <div class="hero" v-if="lat.combos?.length">🏆 Mejor combo LATAM: <b>{{dw(lat.combos[0].ida)}} {{lat.combos[0].ida}} → {{dw(lat.combos[0].vuelta)}} {{lat.combos[0].vuelta}}</b> ({{lat.combos[0].noches}} noches) · <b>{{fmt(lat.combos[0].clp)}}</b> pp · {{pax}} pax ≈ <b>{{fmt(lat.combos[0].clp*pax)}}</b> &nbsp;<a class="btn ggl" href="https://www.latamairlines.com/cl/es" target="_blank" rel="noopener">Comprar en LATAM ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>CLP pp</th><th>{{pax}} pax (est.)</th><th>Verificar</th></tr>
    <tr v-for="c in lat.combos?.slice(0,14)" :key="c.ida+c.vuelta"><td>{{dw(c.ida)}} {{c.ida}} → {{dw(c.vuelta)}} {{c.vuelta}}</td><td>{{c.noches}}</td><td class="p">{{fmt(c.clp)}}</td><td class="p">{{fmt(c.clp*pax)}}</td><td><a class="btn ggl" href="https://www.latamairlines.com/cl/es" target="_blank" rel="noopener">LATAM ↗</a></td></tr>
   </table></div>
   <h2>Mínimo por día · solo directos</h2>
   <div class="tbl"><table><tr><th>Ida SCL→GIG</th><th>CLP</th><th>Vuelta GIG→SCL</th><th>CLP</th></tr>
    <tr v-for="(row,i) in latRows" :key="i"><td>{{row.a?dw(row.a.fecha)+' '+row.a.fecha:''}}</td><td class="p">{{row.a?fmt(row.a.clp):''}}</td><td>{{row.b?dw(row.b.fecha)+' '+row.b.fecha:''}}</td><td class="p">{{row.b?fmt(row.b.clp):''}}</td></tr>
   </table></div>
  </section>
  <!-- 6 Falabella -->
  <section :class="{on:cur===6}">
   <div class="warnbox" v-if="!esFresca(fal.ts)">🕘 <b>Referencia antigua del {{fal.ts||'—'}} (UTC)</b> — Falabella bloquea la lectura automática (DataDome), así que este dato NO es el precio de hoy. Se excluyó del consolidado; el sistema reintenta cada ciclo y lo repone cuando logra leerlo. Tramos por separado (1 adulto, tasas incl.).</div>
   <div class="warnbox" v-else>⚠️ <b>Referencia verificada</b> — {{fal.ts}}. DataDome bloquea el auto-refresco de Falabella; estos mínimos llevan sello de hora. Tramos por separado (1 adulto, tasas incl.); el checkout real manda.</div>
   <div class="hero" v-if="falBest">💡 Mejor ida+y+vuelta referencial Falabella: <b>{{falBest.ida.fecha}} → {{falBest.vuelta.fecha}}</b> ≈ <b>{{fmt(falBest.tot)}}</b> pp · {{pax}} pax ≈ <b>{{fmt(falBest.tot*pax)}}</b></div>
   <div class="tbl"><table><tr><th>Sentido</th><th>Fecha</th><th>Mínimo pp (1 ad.)</th><th>{{pax}} pax (est.)</th><th>Detalle</th><th>Ver en vivo</th></tr>
    <template v-for="d in fal.dias" :key="d.sentido+d.fecha">
     <tr><td>{{d.sentido==='SCL-RIO'?'Ida SCL→Río':'Vuelta Río→SCL'}}</td><td>{{dw(d.fecha)}} {{d.fecha}}</td><td class="p">{{d.min_clp?fmt(d.min_clp):'—'}}</td><td class="p">{{d.min_clp?fmt(d.min_clp*pax):'—'}}</td><td class="b">{{d.det||''}}</td><td><a class="btn fal" :href="falOW(d.sentido,d.fecha)" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
     <tr v-for="c in (d.calendario||[])" :key="c.fecha"><td class="b">· día vecino</td><td>{{dw(c.fecha)}} {{c.fecha}}</td><td class="p b">{{fmt(c.clp)}}</td><td></td><td></td><td><a :href="falOW(d.sentido,c.fecha)" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
    </template>
   </table></div>
  </section>
  <!-- 7 Despegar -->
  <section :class="{on:cur===7}">
   <div class="warnbox" v-if="!esFresca(des.ts)">🕘 <b>Referencia antigua del {{des.ts||'—'}} (UTC)</b> — Despegar bloquea la lectura automática (DataDome), así que este dato NO es el precio de hoy. Se excluyó del consolidado; el sistema reintenta cada ciclo. Tasas incl., 1 adulto.</div>
   <div class="warnbox" v-else>✅ <b>Cotizaciones reales del buscador de Despegar leídas hoy</b> ({{des.ts}}), ordenadas del más barato hacia arriba. Tasas incl., 1 adulto; el total por grupo es estimación.</div>
   <div class="hero" v-if="desBest">💡 Mejor ida+y+vuelta referencial Despegar: <b>{{desBest.ida.fecha}} → {{desBest.vuelta.fecha}}</b> ≈ <b>{{fmt(desBest.tot)}}</b> pp · {{pax}} pax ≈ <b>{{fmt(desBest.tot*pax)}}</b> (con tarjeta BCI la ida baja ~$20.000)</div>
   <div class="tbl"><table><tr><th>Sentido</th><th>Fecha</th><th>Mínimo pp (1 ad.)</th><th>{{pax}} pax (est.)</th><th>Detalle</th><th>Ver en vivo</th></tr>
    <template v-for="d in des.dias||[]" :key="d.sentido+d.fecha">

<script>

else{

createApp({
 data:()=>({DATA:null,SUBS:[],mail:'',cur:0,fi:'',fv:'',fatal:false,
  TABS:['🏅 Consolidado por empresa','🥇 Combos JetSMART','JetSMART · Idas','JetSMART · Vueltas','🥈 SKY · RT','🥉 LATAM (API oficial)','⚠️ Falabella (ref.)','🏬 Despegar (ref.)','🧭 Cocha (real)','🌎 Skiplagged global','🇧🇷 Brasil alternativas','📧 Alertas correo','🎟️ Cyber HOY'],
  COUPONS:[{code:'SUD10SKY',desc:'10% dcto en vuelos y paquetes a Brasil vía SKY',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XWAM',desc:'hasta $100.000 dcto hoteles/paquetes WAM (Búzios, Fortaleza, Porto Seguro)',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'RITZ2X',desc:'hasta $70.000 dcto hoteles Rede Ritz Brasil',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XWISH',desc:'$80.000 dcto paquetes hoteles Wish/Prodigy/Linx',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XBEACHPARK',desc:'$200.000 dcto paquetes Beach Park',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'CAMBORIU2X',desc:'hasta $100.000 dcto hotel Marambaia Camboriú',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'Cupón CMR Sudamérica',desc:'$60.000 web / $80.000 presencial en paquetes (mín $900K web, aplica Brasil)',where:'Falabella Oportunidad Única',url:'https://www.viajesfalabella.cl/ofertas-viajes/oportunidad-unica'},{code:'CYBERPAQ',desc:'$100.000 dcto viajes internacionales',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'SKY + cyber.cl',desc:'$80.000 dcto paquetes a Sudamérica',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'Iberostar cyber.cl',desc:'$150.000 dcto paquetes Caribe y Brasil',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'CYBERASISTENCIA20',desc:'20% dcto asistencia Universal Assistance (tope $50K)',where:'app/asistidos',url:'https://www.viajesfalabella.cl/asistencia-al-viajero'},{code:'LOCALIZA25',desc:'15% dcto autos en Brasil (tope $25K)',where:'app/asistidos',url:'https://www.viajesfalabella.cl/autos'}],
 NAMES:{jetsmart:'JetSMART',sky:'SKY',latam:'LATAM',falabella:'Falabella',despegar:'Despegar',cocha:'Cocha',skiplagged:'Skiplagged'},
  pax:1,PAXOPTS:[1,2,4,5,9]}),
 computed:{
  F(){return this.DATA?.fuentes||{}},
  js(){return this.F.jetsmart||{}},
  sky(){return this.F.sky||{}},
  lat(){return this.F.latam||{}},
  sk(){return this.F.skiplagged||{}},
  fal(){return this.F.falabella||{}},
  des(){return this.F.despegar||{}},
  cocha(){return this.F.cocha||{}},
  cochaMejor(){return (this.cocha.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0]||{}},
  rtPorAerolinea(){
   const por={};
   const add=(cod,airline,clp,ida,vuelta,det,fuente,link,cls)=>{
    if(!(clp>0)||!ida||!vuelta)return;
    if(!por[cod]||clp<por[cod].clp) por[cod]={cod,airline:NOMS[cod]||airline||cod,clp,ida,vuelta,det,fuente,link,cls};
   };
   const cp=this.combosPax[0];
   if(cp) add('JA','JetSMART',cp.clp,cp.ida,cp.vuelta,(cp.v_ida||'')+' / '+(cp.v_vue||'')+' · directo','API oficial',this.jsRT(cp.ida,cp.vuelta),'');
   const sp=this.sky.pairs?.[0];
   if(sp) add('H2','SKY Airline',sp.clp,sp.ida,sp.vuelta,'RT directo oficial','API oficial',this.skyLink(sp),'sky');
   const lc=this.lat.combos?.[0];
   if(lc) add('LA','LATAM',lc.clp,lc.ida,lc.vuelta,'suma de tramos directos','API oficial','https://www.latamairlines.com/cl/es','ggl');
   if(this.esFresca(this.cocha.ts)) for(const v of this.cocha.ventanas||[]) for(const r of v.resultados||[])
    add(r.cod,r.aerolinea,r.clp,v.ida,v.vuelta,r.det+(r.escalas===0?' · directo':''),'Cocha real',v.link,'fal');
   if(this.esFresca(this.sk.ts)) for(const v of this.sk.ventanas||[]) for(const r of v.resultados||[])
    add(r.cod,r.aerolinea,r.clp,v.ida,v.vuelta,r.det+(r.escalas===0?' · directo':''),'Skiplagged',v.link,'');
   return Object.values(por).sort((a,b)=>a.clp-b.clp);
  },
  mezclas(){
   const idas=[],vueltas=[];
   for(const x of this.js.idas||[]) if(x.clp>0) idas.push({fecha:x.fecha,clp:x.clp,cod:'JA',det:'JetSMART '+x.vuelo+' '+x.hora,link:this.jsOW(x.fecha,'SCL','GIG'),cls:''});
   for(const x of this.js.vueltas||[]) if(x.clp>0) vueltas.push({fecha:x.fecha,clp:x.clp,cod:'JA',det:'JetSMART '+x.vuelo+' '+x.hora,link:this.jsOW(x.fecha,'GIG','SCL'),cls:''});
   for(const x of this.lat.dias_out||[]) if(x.clp>0) idas.push({fecha:x.fecha,clp:x.clp,cod:'LA',det:'LATAM '+(x.directo?'directo':'con escala'),link:'https://www.latamairlines.com/cl/es',cls:'ggl'});
   for(const x of this.lat.dias_in||[]) if(x.clp>0) vueltas.push({fecha:x.fecha,clp:x.clp,cod:'LA',det:'LATAM '+(x.directo?'directo':'con escala'),link:'https://www.latamairlines.com/cl/es',cls:'ggl'});
   if(this.esFresca(this.sk.ts)) for(const v of this.sk.ventanas||[]){
    for(const r of v.ow_out||[]) if(r.clp>0) idas.push({fecha:r.fecha,clp:r.clp,cod:r.cod,det:(NOMS[r.cod]||r.aerolinea||r.cod)+' '+r.det,link:v.link,cls:''});
    for(const r of v.ow_in||[]) if(r.clp>0) vueltas.push({fecha:r.fecha,clp:r.clp,cod:r.cod,det:(NOMS[r.cod]||r.aerolinea||r.cod)+' '+r.det,link:v.link,cls:''});
   }
   let best=null;
   for(const i of idas) for(const v of vueltas){
    if(i.cod===v.cod) continue;
    const n=this.noches(i.fecha,v.fecha);
    if(n<9||v.fecha>'2027-02-23') continue;
    const t=i.clp+v.clp;
    if(!best||t<best.total) best={total:t,ida:i,vuelta:v,noches:n};
   }
   return best;
  },
  campeon(){
   const rt=this.rtPorAerolinea[0],mx=this.mezclas,c=[];
   if(rt) c.push({total:rt.clp,ida:rt.ida,vuelta:rt.vuelta,noches:this.noches(rt.ida,rt.vuelta),tipo:'rt',ref:rt,
    titulo:'✈️ Ida y vuelta '+rt.airline+' ('+rt.fuente+')',
    botones:[{texto:'Comprar '+rt.airline+' ↗',href:rt.link,cls:rt.cls}]});
   if(mx) c.push({total:mx.total,ida:mx.ida.fecha,vuelta:mx.vuelta.fecha,noches:mx.noches,tipo:'mix',ref:mx,
    titulo:'🔀 Ida '+this.nomAer(mx.ida.cod)+' + vuelta '+this.nomAer(mx.vuelta.cod)+' (compañías distintas)',
    botones:[{texto:'Comprar ida ↗',href:mx.ida.link,cls:mx.ida.cls},{texto:'Comprar vuelta ↗',href:mx.vuelta.link,cls:mx.vuelta.cls}]});
   if(!c.length) return null;
   return c.sort((a,b)=>a.total-b.total)[0];
  },
  consol(){const r=[];
   const sp=this.sky.pairs?.[0]; if(sp) r.push({emp:'SKY Airline',tipo:'API oficial · RT directo',det:'Mínimo oficial ida y vuelta',ida:sp.ida,vuelta:sp.vuelta,pp:sp.clp,link:this.skyLink(sp),cls:'sky'});
   const cp=this.combosPax[0]; if(cp) r.push({emp:'JetSMART',tipo:'API oficial · RT directo',det:(cp.v_ida||'')+' / '+(cp.v_vue||''),ida:cp.ida,vuelta:cp.vuelta,pp:cp.clp,link:this.jsRT(cp.ida,cp.vuelta),cls:''});
   const lc=this.lat.combos?.[0]; if(lc) r.push({emp:'LATAM',tipo:'API oficial · suma idas+vueltas directas',det:'Mínimo oficial ida y vuelta',ida:lc.ida,vuelta:lc.vuelta,pp:lc.clp,link:'https://www.latamairlines.com/cl/es',cls:'lat'});
   const cv=(this.cocha.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];
   if(cv&&this.esFresca(this.cocha.ts)) r.push({emp:'Cocha',tipo:'OTA · cotización real API',det:'Mejor cotización multi-aerolínea',ida:cv.ida,vuelta:cv.vuelta,pp:cv.min_clp,link:cv.link,cls:'fal'});
   const sv=(this.sk.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];
   if(sv&&this.esFresca(this.sk.ts)) r.push({emp:'Skiplagged',tipo:'Metasearch · 10+ aerolíneas',det:'Mejor RT global (CLP vía dólar observado)',ida:sv.ida,vuelta:sv.vuelta,pp:sv.min_clp,link:sv.link,cls:''});
   const fb=this.falBest; if(fb&&this.esFresca(this.fal.ts)) r.push({emp:'Viajes Falabella',tipo:'OTA · referencia del día',det:'Mejor ida + mejor vuelta publicadas',ida:fb.ida.fecha,vuelta:fb.vuelta.fecha,pp:fb.tot,link:this.falOW(fb.ida.sentido,fb.ida.fecha),cls:'fal'});
   const db=this.desBest; if(db&&this.esFresca(this.des.ts)) r.push({emp:'Despegar',tipo:'OTA · referencia del día',det:'Mejor ida + mejor vuelta publicadas',ida:db.ida.fecha,vuelta:db.vuelta.fecha,pp:db.tot,link:this.desOW(db.ida.sentido,db.ida.fecha),cls:'fal'});
   return r.sort((a,b)=>a.pp-b.pp)},
  desBest(){const ds=this.des.dias||[];const i=ds.filter(d=>d.sentido==='SCL-GIG'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];const v=ds.filter(d=>d.sentido==='GIG-SCL'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];return i&&v?{ida:i,vuelta:v,tot:i.min_clp+v.min_clp}:null},
  falBest(){const ds=this.fal.dias||[];const i=ds.filter(d=>d.sentido==='SCL-RIO'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];const v=ds.filter(d=>d.sentido==='RIO-SCL'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];return i&&v?{ida:i,vuelta:v,tot:i.min_clp+v.min_clp}:null},
  combosPax(){const m=this.js.combos_by_pax||{};return m[String(this.pax)]||this.js.combos||[]},
  fI(){const o=this.fi.trim();return [...(this.js.idas||[])].filter(x=>!o||x.fecha.includes(o)).sort((a,b)=>a.clp-b.clp)},
  fV(){const o=this.fv.trim();return [...(this.js.vueltas||[])].filter(x=>!o||x.fecha.includes(o)).sort((a,b)=>a.clp-b.clp)},
  latRows(){const a=this.lat.dias_out||[],b=this.lat.dias_in||[],n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push({a:a[i],b:b[i]});return r}
 },
 methods:{
  dw(d){if(!d)return'';const[p,m,dd]=d.split('-').map(Number);return DIA[new Date(p,m-1,dd).getDay()]},
  fmt(n){return '$ '+Math.round(n).toLocaleString('es-CL')},
  jsOW(f,o,dd){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=false&cur=CLP&culture=es-CL&dd1=${f}&o1=${o}&d1=${dd}`},
  jsRT(i,v){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=true&cur=CLP&culture=es-CL&dd1=${i}&o1=SCL&d1=GIG&dd2=${v}`},
  skyLink(s){const m={1:[1,0],2:[2,0],4:[4,0],5:[4,1],9:[8,1]}[this.pax]||[this.pax,0];return `https://initial-sale.skyairline.com/es/chile?origin=SCL&destination=GIG&departureDate=${s.ida}&arrivalDate=${s.vuelta}&flightType=RT&ADT=${m[0]}`+(m[1]?`&CHD=${m[1]}`:'')},
  subUrl(acc){const repo=location.pathname.includes('qwen_vuelos_rio')?'qwen_vuelos_rio':'vuelos-rio-live';return `https://github.com/Xacox01/${repo}/issues/new?title=${encodeURIComponent(acc+' '+this.mail.trim())}&body=${encodeURIComponent('Solicitud automatica desde el dashboard vuelos-rio-live.')}`},
  noches(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)},
  nomAer(c){return NOMS[c]||c},
  esFresca(ts){if(!ts)return false;const t=Date.parse(String(ts).replace(' ','T')+'Z');return isFinite(t)&&(Date.now()-t)<864e5},
  maskMail(s){const p=s.split('@');return (p[0]||'').slice(0,2)+'•••@'+(p[1]||'')},
  falOW(s,f){const[O,D]=s.split('-');return `https://www.viajesfalabella.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  desOW(s,f){const[O,D]=s.split('-');return `https://www.despegar.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  async poll(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});this.DATA=await r.json()}catch(e){console.error(e)}try{const s=await fetch('subscribers.json?t='+Date.now(),{cache:'no-store'});if(s.ok)this.SUBS=await s.json()}catch(e){}},
 },
 async mounted(){await this.poll();setInterval(()=>this.poll(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.poll()})}
}).mount('#app');
}
</script></body></html>
