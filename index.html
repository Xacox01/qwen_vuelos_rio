<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vuelos SCL⇄Río · EN VIVO · ene–feb 2027</title>
<style>
:root{--bg:#0f172a;--panel:#111c33;--line:#24334d;--txt:#e2e8f0;--mut:#94a3b8;--grn:#4ade80;--blu:#60a5fa;--tabs-h:52px}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#1e3a8a,#7c3aed);padding:14px 16px;position:sticky;top:0;z-index:10}
h1{margin:0 0 2px;font-size:clamp(1rem,4vw,1.3rem)}
.sub{opacity:.92;font-size:clamp(.72rem,2.6vw,.85rem)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{background:#052e16;border:1px solid #16a34a;color:#86efac;border-radius:20px;padding:3px 10px;font-size:.72rem;white-space:nowrap}
.badge.warn{background:#422006;border-color:#b45309;color:#fcd34d}
.badge.info{background:#1e293b;border-color:#334155;color:#cbd5e1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--panel);position:sticky;top:0;z-index:9;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.8rem}
nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
main{padding:10px 12px 60px;max-width:1100px;margin:0 auto}
section{display:none}section.on{display:block}
.ok,.warnbox{border-radius:10px;padding:10px 12px;font-size:.8rem;margin:10px 0;line-height:1.45}
.ok{background:#052e16;border:1px solid #166534}
.warnbox{background:#422006;border:1px solid #92400e}
.hero{background:#132a4a;border:1px solid #1d4ed8;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.88rem;line-height:1.5}
.hero b{color:var(--grn);font-size:1.05rem}
.tbl{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel);overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;min-width:560px}
th{background:#1e293b;text-align:left;padding:8px 9px;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#182742}
.p{color:var(--grn);font-weight:600;white-space:nowrap}
.b{color:var(--mut);font-size:.72rem}
a{color:var(--blu);text-decoration:none;white-space:nowrap}
.btn{display:inline-block;background:#16a34a;color:#fff!important;border-radius:7px;padding:5px 10px;font-weight:600;font-size:.75rem}
.btn.sky{background:#7c3aed}.btn.ggl{background:#1d4ed8}.btn.fal{background:#b45309}
h2{font-size:.95rem;margin:16px 0 4px}
input.filt{width:100%;margin:8px 0;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px 10px;color:var(--txt);font-size:.85rem}
.spin{display:inline-block;width:9px;height:9px;border:2px solid var(--grn);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:20px auto;max-width:560px;background:#422006;border:1px solid #92400e;border-radius:12px;padding:16px;font-size:.9rem}
@media (max-width:640px){
 table{min-width:520px;font-size:.76rem}
 th,td{padding:6px 7px}
 .hero{font-size:.82rem}
 main{padding:8px 8px 50px}
}
</style></head><body>
<div id="app">
 <div v-if="fatal" class="err">⚠️ No se pudo cargar el motor de la interfaz (Vue). Revisa tu conexión y recarga.</div>
 <template v-else>
 <header>
  <h1>✈️ SCL ⇄ Río de Janeiro · precios EN VIVO</h1>
  <div class="sub">ene–feb 2027 · regreso ≤ 23-feb · CLP pp · <span class="spin"></span>datos refrescados cada 5 min por GitHub Actions</div>
  <div class="badges">
   <span class="badge info">🕐 Actualizado: {{DATA?.updated||'—'}}</span>
   <span v-for="(v,k) in (DATA?.fuentes||{})" :key="k" class="badge" :class="{warn:!v.ok}">{{v.ok?'✅':'⚠️'}} {{NAMES[k]||k}}</span>
  </div>
 </header>
 <nav>
  <button v-for="(t,i) in TABS" :key="i" :class="{on:cur===i}" @click="cur=i">{{t}}</button>
 </nav>
 <main>
  <!-- 0 combos JetSMART -->
  <section :class="{on:cur===0}">
   <div class="ok">✅ <b>API oficial de disponibilidad JetSMART</b> — el botón verde abre el checkout real con esas fechas cargadas. Elige cuántos pasajeros cotizan: el precio pp se recalcula con la <b>asignación real de asientos por cubo de tarifa</b> (por eso 5 pax puede salir más caro que 1).</div>
<div style="display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap"><span class="b">Pasajeros:</span><button v-for="n in PAXOPTS" :key="n" class="btn" :style="pax===n?'':'background:#1e293b;border:1px solid #334155'" @click="pax=n">{{n}}</button></div>
   <div class="hero" v-if="combosPax.length">🏆 Mejor combinación para {{pax}} pax: <b>{{dw(combosPax[0].ida)}} {{combosPax[0].ida}} → {{dw(combosPax[0].vuelta)}} {{combosPax[0].vuelta}}</b> ({{combosPax[0].noches}} noches)<br>
    {{combosPax[0].v_ida}} + {{combosPax[0].v_vue}} · <b>{{fmt(combosPax[0].clp)}}</b> pp · total {{pax}} pax = <b>{{fmt(combosPax[0].tot??combosPax[0].clp*pax)}}</b>
    &nbsp;<a class="btn" :href="jsRT(combosPax[0].ida,combosPax[0].vuelta)" target="_blank" rel="noopener">Comprar ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>Vuelos</th><th>CLP pp ({{pax}} pax)</th><th>Total grupo</th><th>Comprar</th></tr>
    <tr v-for="c in combosPax.slice(0,14)" :key="c.ida+c.vuelta"><td>{{dw(c.ida)}} {{c.ida}} → {{dw(c.vuelta)}} {{c.vuelta}}</td><td>{{c.noches}}</td><td><b>{{c.v_ida}}</b> / <b>{{c.v_vue}}</b></td><td class="p">{{fmt(c.clp)}}</td><td class="p">{{fmt(c.tot??c.clp*pax)}}</td><td><a class="btn" :href="jsRT(c.ida,c.vuelta)" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 1 y 2 vuelos JetSMART -->
  <section :class="{on:cur===1}">
   <div class="ok">✅ API oficial JetSMART · ida SCL→GIG.</div>
   <input class="filt" v-model="fi" placeholder="Filtrar por fecha (ej: 2027-01-22 o 2027-01)">
   <div class="tbl"><table><tr><th>Fecha</th><th>Vuelo</th><th>Salida</th><th>Desde (pp)</th><th>Clases</th><th>Comprar</th></tr>
    <tr v-for="x in fI" :key="x.fecha+x.vuelo+x.hora"><td>{{dw(x.fecha)}} {{x.fecha}}</td><td><b>{{x.vuelo}}</b></td><td>{{x.hora}}</td><td class="p">{{fmt(x.clp)}}</td><td class="b">{{(x.buckets||[]).join(', ')}}</td><td><a class="btn" :href="jsOW(x.fecha,'SCL','GIG')" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
    <tr v-if="!fI.length"><td colspan="6">Sin resultados para ese filtro</td></tr>
   </table></div>
  </section>
  <section :class="{on:cur===2}">
   <div class="ok">✅ API oficial JetSMART · vuelta GIG→SCL.</div>
   <input class="filt" v-model="fv" placeholder="Filtrar por fecha (ej: 2027-02-01 o 2027-02)">
   <div class="tbl"><table><tr><th>Fecha</th><th>Vuelo</th><th>Salida</th><th>Desde (pp)</th><th>Clases</th><th>Comprar</th></tr>
    <tr v-for="x in fV" :key="x.fecha+x.vuelo+x.hora"><td>{{dw(x.fecha)}} {{x.fecha}}</td><td><b>{{x.vuelo}}</b></td><td>{{x.hora}}</td><td class="p">{{fmt(x.clp)}}</td><td class="b">{{(x.buckets||[]).join(', ')}}</td><td><a class="btn" :href="jsOW(x.fecha,'GIG','SCL')" target="_blank" rel="noopener">Comprar ↗</a></td></tr>
    <tr v-if="!fV.length"><td colspan="6">Sin resultados para ese filtro</td></tr>
   </table></div>
  </section>
  <!-- 3 SKY -->
  <section :class="{on:cur===3}">
   <div class="ok">✅ <b>API oficial SKY</b> (histograma de skyairline.com) · RT 9–12 noches. Corrobora buscando el par exacto en skyairline.com.</div>
   <div class="hero" v-if="sky.pairs?.length">🏆 Mejor tarifa SKY: <b>{{dw(sky.pairs[0].ida)}} {{sky.pairs[0].ida}} → {{dw(sky.pairs[0].vuelta)}} {{sky.pairs[0].vuelta}}</b> ({{sky.pairs[0].noches}} noches) · <b>{{fmt(sky.pairs[0].clp)}}</b> pp · ×9 = <b>{{fmt(sky.pairs[0].clp*9)}}</b> &nbsp;<a class="btn sky" href="https://www.skyairline.com/chile/" target="_blank" rel="noopener">Ir a SKY ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>CLP pp</th><th>CLP ×9</th><th>Verificar</th></tr>
    <tr v-for="s in sky.pairs" :key="s.ida+s.vuelta"><td>{{dw(s.ida)}} {{s.ida}} → {{dw(s.vuelta)}} {{s.vuelta}}</td><td>{{s.noches}}</td><td class="p">{{fmt(s.clp)}}</td><td class="p">{{fmt(s.clp*9)}}</td><td><a class="btn sky" href="https://www.skyairline.com/chile/" target="_blank" rel="noopener">Buscar ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 4 LATAM oficial -->
  <section :class="{on:cur===4}">
   <div class="ok">✅ <b>API oficial web de LATAM</b> (calendario de latamairlines.com, solo directos). Combos = ida + vuelta.</div>
   <div class="hero" v-if="lat.combos?.length">🏆 Mejor combo LATAM: <b>{{dw(lat.combos[0].ida)}} {{lat.combos[0].ida}} → {{dw(lat.combos[0].vuelta)}} {{lat.combos[0].vuelta}}</b> ({{lat.combos[0].noches}} noches) · <b>{{fmt(lat.combos[0].clp)}}</b> pp · ×9 = <b>{{fmt(lat.combos[0].clp*9)}}</b> &nbsp;<a class="btn ggl" href="https://www.latamairlines.com/cl/es" target="_blank" rel="noopener">Comprar en LATAM ↗</a></div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Noches</th><th>CLP pp</th><th>CLP ×9</th><th>Verificar</th></tr>
    <tr v-for="c in lat.combos?.slice(0,14)" :key="c.ida+c.vuelta"><td>{{dw(c.ida)}} {{c.ida}} → {{dw(c.vuelta)}} {{c.vuelta}}</td><td>{{c.noches}}</td><td class="p">{{fmt(c.clp)}}</td><td class="p">{{fmt(c.clp*9)}}</td><td><a class="btn ggl" href="https://www.latamairlines.com/cl/es" target="_blank" rel="noopener">LATAM ↗</a></td></tr>
   </table></div>
   <h2>Mínimo por día · solo directos</h2>
   <div class="tbl"><table><tr><th>Ida SCL→GIG</th><th>CLP</th><th>Vuelta GIG→SCL</th><th>CLP</th></tr>
    <tr v-for="(row,i) in latRows" :key="i"><td>{{row.a?dw(row.a.fecha)+' '+row.a.fecha:''}}</td><td class="p">{{row.a?fmt(row.a.clp):''}}</td><td>{{row.b?dw(row.b.fecha)+' '+row.b.fecha:''}}</td><td class="p">{{row.b?fmt(row.b.clp):''}}</td></tr>
   </table></div>
  </section>
  <!-- 5 Google espejo -->
  <section :class="{on:cur===5}">
   <div class="warnbox">🔎 LATAM bloquea bots en su sitio; esto es su inventario espejado en Google Flights. El botón abre la búsqueda ya armada (solo directos).</div>
   <div class="tbl"><table><tr><th>Ida → Vuelta</th><th>Vuelo</th><th>Salida</th><th>CLP pp RT</th><th>Verificar</th></tr>
    <tr v-for="v in ggl.vuelos" :key="(v.codigo||'')+v.ida"><td>{{v.ida?dw(v.ida)+' '+v.ida+' → '+dw(v.vuelta)+' '+v.vuelta:'—'}}</td><td><b>{{v.codigo||''}}</b></td><td>{{v.hora||''}}</td><td class="p">{{fmt(v.clp)}}</td><td><a class="btn ggl" :href="v.link" target="_blank" rel="noopener">Google ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 6 Falabella -->
  <section :class="{on:cur===6}">
   <div class="warnbox">⚠️ <b>Referencia no garantizada</b>: mínimos de la caché SSR de viajesfalabella.cl (1 adulto). El checkout real manda.</div>
   <div class="tbl"><table><tr><th>Sentido</th><th>Fecha</th><th>Mínimo pp</th><th>Estado</th><th>Ver en vivo</th></tr>
    <template v-for="d in fal.dias" :key="d.sentido+d.fecha">
     <tr><td>{{d.sentido==='SCL-RIO'?'Ida SCL→Río':'Vuelta Río→SCL'}}</td><td>{{dw(d.fecha)}} {{d.fecha}}</td><td class="p">{{d.min_clp?fmt(d.min_clp):'—'}}</td><td>{{d.status===200?'✅':'❌ '+d.status}}</td><td><a class="btn fal" :href="falOW(d.sentido,d.fecha)" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
     <tr v-for="c in (d.calendario||[])" :key="c.fecha"><td class="b">· día vecino</td><td>{{dw(c.fecha)}} {{c.fecha}}</td><td class="p b">{{fmt(c.clp)}}</td><td></td><td><a :href="falOW(d.sentido,c.fecha)" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
    </template>
   </table></div>
  </section>
  <!-- 7 Despegar & Cocha -->
  <section :class="{on:cur===7}">
   <div class="warnbox">⚠️ Referencias públicas: mínimos SSR de despegar.cl y tarjetas "Desde" de cocha.com. El checkout real manda.</div>
   <div class="hero" v-if="cocha.rio">🏬 Cocha: SCL⇄Río ida y vuelta <b>desde {{fmt(cocha.rio.clp)}}</b> pp (precio final publicado) &nbsp;<a class="btn fal" href="https://www.cocha.com/vuelos/destinos/rio-de-janeiro" target="_blank" rel="noopener">Ver en Cocha ↗</a></div>
   <div class="tbl"><table><tr><th>Fuente</th><th>Sentido / destino</th><th>Fecha</th><th>Mínimo pp</th><th>Abrir</th></tr>
    <tr v-for="d in des.dias||[]" :key="d.sentido+d.fecha"><td>Despegar</td><td>{{d.sentido==='SCL-RIO'?'Ida SCL→Río':'Vuelta Río→SCL'}}</td><td>{{dw(d.fecha)}} {{d.fecha}}</td><td class="p">{{d.min_clp?fmt(d.min_clp):'—'}}</td><td><a class="btn sky" :href="desOW(d.sentido,d.fecha)" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
    <tr v-for="c in cocha.cards||[]" :key="c.destino"><td>Cocha</td><td>{{c.destino}}</td><td></td><td class="p">{{fmt(c.clp)}}</td><td><a class="btn fal" href="https://www.cocha.com/vuelos" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
   </table></div>
  </section>
  <!-- 8 Cupones -->
  <section :class="{on:cur===8}">
   <div class="warnbox">⏰ <b>CyberMonday Chile termina HOY 7-oct 23:59.</b> Cupones verificados en las páginas oficiales; stock limitado, un uso por cliente en la mayoría. Pruébalos en el checkout ("¿Tienes un cupón?").</div>
   <div class="tbl"><table><tr><th>Código</th><th>Descuento</th><th>Dónde</th><th>Ir</th></tr>
    <tr v-for="c in COUPONS" :key="c.code"><td><b>{{c.code}}</b></td><td>{{c.desc}}</td><td class="b">{{c.where}}</td><td><a class="btn fal" :href="c.url" target="_blank" rel="noopener">Abrir ↗</a></td></tr>
   </table></div>
   <div class="ok">💳 Además: JetSMART hasta 60% dcto a Brasil con promos extra para clientes <b>BancoEstado y BCI</b>; LATAM hasta 71% dcto internacional (vuelo hasta dic-2027); SKY Cyber hasta 70% en rutas seleccionadas.</div>
  </section>
 </main>
 </template>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if(!window.Vue){document.getElementById('app').innerHTML='<div class="err">⚠️ No se pudo cargar Vue (CDN bloqueado). Recarga o revisa tu conexión.</div>';}
else{
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const {createApp}=Vue;
createApp({
 data:()=>({DATA:null,cur:0,fi:'',fv:'',fatal:false,
  TABS:['🥇 Combos JetSMART','JetSMART · Idas','JetSMART · Vueltas','🥈 SKY · RT','🥉 LATAM (API oficial)','🔎 LATAM (espejo Google)','⚠️ Falabella (ref.)','🏬 Despegar & Cocha (ref.)','🎟️ Cyber HOY'],
  COUPONS:[{code:'SUD10SKY',desc:'10% dcto en vuelos y paquetes a Brasil vía SKY',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XWAM',desc:'hasta $100.000 dcto hoteles/paquetes WAM (Búzios, Fortaleza, Porto Seguro)',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'RITZ2X',desc:'hasta $70.000 dcto hoteles Rede Ritz Brasil',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XWISH',desc:'$80.000 dcto paquetes hoteles Wish/Prodigy/Linx',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'2XBEACHPARK',desc:'$200.000 dcto paquetes Beach Park',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'CAMBORIU2X',desc:'hasta $100.000 dcto hotel Marambaia Camboriú',where:'Viajes Falabella 2X',url:'https://www.viajesfalabella.cl/2x'},{code:'Cupón CMR Sudamérica',desc:'$60.000 web / $80.000 presencial en paquetes (mín $900K web, aplica Brasil)',where:'Falabella Oportunidad Única',url:'https://www.viajesfalabella.cl/ofertas-viajes/oportunidad-unica'},{code:'CYBERPAQ',desc:'$100.000 dcto viajes internacionales',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'SKY + cyber.cl',desc:'$80.000 dcto paquetes a Sudamérica',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'Iberostar cyber.cl',desc:'$150.000 dcto paquetes Caribe y Brasil',where:'Cocha / cyber.cl',url:'https://www.cocha.com/promociones/cybermonday'},{code:'CYBERASISTENCIA20',desc:'20% dcto asistencia Universal Assistance (tope $50K)',where:'app/asistidos',url:'https://www.viajesfalabella.cl/asistencia-al-viajero'},{code:'LOCALIZA25',desc:'15% dcto autos en Brasil (tope $25K)',where:'app/asistidos',url:'https://www.viajesfalabella.cl/autos'}],
 NAMES:{jetsmart:'JetSMART',sky:'SKY',latam:'LATAM',google:'Google/LATAM',falabella:'Falabella',despegar:'Despegar',cocha:'Cocha'},
  pax:1,PAXOPTS:[1,2,4,5,9]}),
 computed:{
  F(){return this.DATA?.fuentes||{}},
  js(){return this.F.jetsmart||{}},
  sky(){return this.F.sky||{}},
  lat(){return this.F.latam||{}},
  ggl(){return this.F.google||{}},
  fal(){return this.F.falabella||{}},
  des(){return this.F.despegar||{}},
  cocha(){return this.F.cocha||{}},
  combosPax(){const m=this.js.combos_by_pax||{};return m[String(this.pax)]||this.js.combos||[]},
  fI(){const o=this.fi.trim();return (this.js.idas||[]).filter(x=>!o||x.fecha.includes(o))},
  fV(){const o=this.fv.trim();return (this.js.vueltas||[]).filter(x=>!o||x.fecha.includes(o))},
  latRows(){const a=this.lat.dias_out||[],b=this.lat.dias_in||[],n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push({a:a[i],b:b[i]});return r}
 },
 methods:{
  dw(d){if(!d)return'';const[p,m,dd]=d.split('-').map(Number);return DIA[new Date(p,m-1,dd).getDay()]},
  fmt(n){return '$ '+Math.round(n).toLocaleString('es-CL')},
  jsOW(f,o,dd){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=false&cur=CLP&culture=es-CL&dd1=${f}&o1=${o}&d1=${dd}`},
  jsRT(i,v){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=true&cur=CLP&culture=es-CL&dd1=${i}&o1=SCL&d1=GIG&dd2=${v}`},
  falOW(s,f){const[O,D]=s.split('-');return `https://www.viajesfalabella.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  desOW(s,f){const[O,D]=s.split('-');return `https://www.despegar.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  async poll(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});this.DATA=await r.json()}catch(e){console.error(e)}},
 },
 async mounted(){await this.poll();setInterval(()=>this.poll(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.poll()})}
}).mount('#app');
}
</script></body></html>
