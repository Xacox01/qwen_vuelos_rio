<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Radar en vivo: vuelos Santiago⇄Río de Janeiro ene–feb 2027 y las mejores playas de Latinoamérica bajo $500.000. Precios reales de APIs oficiales, Cocha, Skiplagged, Falabella y Despegar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Radar Río · Vuelos SCL⇄GIG y playas LatAm en vivo · ene–feb 2027</title>
<style>
:root{
 --bg:#f5f7fc;--surface:#ffffff;--soft:#f8fafd;
 --ink:#0b1220;--mut:#54617c;--mut2:#8894ad;
 --line:#e5eaf4;--line2:#d3dcee;
 --brand:#4f46e5;--brand2:#0891b2;
 --grad:linear-gradient(115deg,#4f46e5 0%,#2563eb 48%,#0891b2 100%);
 --good:#059669;--goodbg:#ecfdf5;--goodln:#a7f3d0;
 --warn:#b45309;--warnbg:#fffbeb;--warnln:#fde68a;
 --bad:#e11d48;--badbg:#fff1f2;
 --r:20px;--r2:14px;--r3:11px;
 --sh1:0 1px 2px rgba(11,18,32,.05);
 --sh2:0 2px 6px rgba(11,18,32,.05),0 14px 36px rgba(11,18,32,.07);
 --sh3:0 6px 16px rgba(11,18,32,.09),0 28px 56px rgba(11,18,32,.11);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;margin:0;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15.5px;line-height:1.5}
[v-cloak]{display:none}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--line)}
.hwrap{max-width:1160px;margin:0 auto;padding:12px 18px}
.htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 6px 16px rgba(37,99,235,.32)}
.mark svg{width:23px;height:23px}
.hbrand{font-weight:800;letter-spacing:-.02em;font-size:1.06rem;line-height:1.15;white-space:nowrap}
.hbrand .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hsub{font-size:.72rem;color:var(--mut);font-weight:600;white-space:nowrap}
.livepill{display:inline-flex;align-items:center;gap:7px;background:var(--goodbg);border:1px solid var(--goodln);color:#065f46;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 13px;border-radius:999px;margin-left:auto;white-space:nowrap}
.livepill i{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.hstat{font-size:.72rem;color:var(--mut2);font-weight:600;white-space:nowrap}
.paxrow{display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:.78rem;font-weight:700;padding:5px 14px;border-radius:999px;cursor:pointer;transition:.18s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.paxnote{font-size:.76rem;color:var(--mut);font-weight:600}
.paxnote b{color:var(--good)}
/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:39;background:rgba(245,247,252,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nwrap{max-width:1160px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
.nwrap::-webkit-scrollbar{display:none}
.nwrap button{flex:0 0 auto;background:#fff;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;font:inherit;font-size:.79rem;font-weight:700;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nwrap button:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.nwrap button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 14px rgba(11,18,32,.22)}
.nwrap button .cnt{background:var(--badbg);color:var(--bad);border-radius:999px;font-size:.62rem;padding:1px 7px;font-weight:800}
.nwrap button.on .cnt{background:rgba(255,255,255,.2);color:#fff}
/* ---------- layout ---------- */
main{max-width:1160px;margin:0 auto;padding:20px 16px 80px}
section{display:none}
section.on{display:block;animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2{font-size:1.22rem;font-weight:800;letter-spacing:-.02em;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2:first-child{margin-top:6px}
.h2sub{font-size:.8rem;color:var(--mut);font-weight:600;letter-spacing:0}
/* ---------- notas / estados ---------- */
.note{border-radius:var(--r2);padding:13px 16px;font-size:.84rem;line-height:1.6;margin:14px 0;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.note.ok{background:var(--goodbg);border-color:var(--goodln);color:#065f46}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.note.warn{background:var(--warnbg);border-color:var(--warnln);color:#92400e}
.note b{font-weight:800}
.note .ic{flex:0 0 auto;font-size:1rem;line-height:1.4}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- hero ---------- */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh2);margin:16px 0 6px;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.hgrid{display:grid;grid-template-columns:1.25fr .95fr;gap:0;min-height:0}
.hmain{padding:30px 34px 28px;position:relative}
.kick{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brand2)}
.bestprice{font-size:clamp(3rem,8vw,4.6rem);font-weight:800;letter-spacing:-.045em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;margin:10px 0 2px}
.per{font-size:.85rem;color:var(--mut);font-weight:700}
.bestroute{font-size:1.06rem;font-weight:800;margin-top:12px;letter-spacing:-.01em}
.bestdates{font-size:.86rem;color:var(--mut);margin-top:3px;font-weight:600}
.bestdet{font-size:.78rem;color:var(--mut2);margin-top:7px;line-height:1.55}
.hctas{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.hside{padding:26px 26px;background:linear-gradient(170deg,#f7f9ff 0%,#f2fbfa 100%);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;justify-content:center}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh1);transition:.2s;cursor:pointer}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi .ki{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem;flex:0 0 auto}
.kpi .ki.g{background:var(--goodbg);border:1px solid var(--goodln)}
.kpi .ki.b{background:#eff6ff;border:1px solid #bfdbfe}
.kpi .ki.v{background:#f5f3ff;border:1px solid #ddd6fe}
.kpi .ki.o{background:var(--warnbg);border:1px solid var(--warnln)}
.kpi .kv{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2}
.kpi .kl{font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:1px}
/* ---------- ticker ---------- */
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:999px;background:#fff;margin:14px 0;position:relative;box-shadow:var(--sh1)}
.ticker .track{display:flex;gap:38px;white-space:nowrap;padding:9px 20px;animation:mq 32s linear infinite;width:max-content}
.ticker:hover .track{animation-play-state:paused}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-size:.74rem;color:var(--mut);font-weight:600}
.tk b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:.82rem;font-weight:800}
/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff!important;border-radius:13px;padding:10px 18px;font-weight:800;font-size:.8rem;text-decoration:none;transition:.18s;box-shadow:0 3px 12px rgba(37,99,235,.28);white-space:nowrap;border:0;cursor:pointer;letter-spacing:-.01em}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.4);filter:brightness(1.05)}
.btn:active{transform:translateY(0)}
.btn.ink{background:var(--ink);box-shadow:0 3px 12px rgba(11,18,32,.25)}
.btn.good{background:linear-gradient(115deg,#059669,#0d9488);box-shadow:0 3px 12px rgba(5,150,105,.3)}
.btn.amber{background:linear-gradient(115deg,#d97706,#ea580c);box-shadow:0 3px 12px rgba(217,119,6,.3)}
.btn.rose{background:linear-gradient(115deg,#e11d48,#db2777);box-shadow:0 3px 12px rgba(225,29,72,.3)}
.btn.ghost{background:#fff;color:var(--ink)!important;border:1px solid var(--line2);box-shadow:none;font-weight:700}
.btn.ghost:hover{border-color:#a8b6d0;background:var(--soft)}
.btn.sm{padding:7px 13px;font-size:.73rem;border-radius:11px}
/* ---------- cards grid ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin:14px 0}
.ccard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--sh1);transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ccard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh2)}
.ccard .rk{position:absolute;top:13px;right:15px;font-size:.95rem}
.ccard .air{font-weight:800;font-size:.98rem;letter-spacing:-.015em;padding-right:34px}
.ccard .pri{font-size:1.62rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;margin:6px 0 3px;line-height:1.08;letter-spacing:-.03em}
.ccard .dt{font-size:.76rem;color:var(--mut);line-height:1.55;margin-top:2px}
.ccard .src{font-size:.63rem;color:var(--mut2);margin-top:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.ccard .btn{margin-top:12px;width:100%}
.ccard .grow{flex:1}
/* ---------- chips ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:1px solid var(--line);color:#47536b;border-radius:999px;padding:3px 11px;font-size:.67rem;font-weight:700}
.chip.save{background:var(--goodbg);border-color:var(--goodln);color:#047857}
.chip.hot{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.chip.info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
/* ---------- deal cards (merchandising) ---------- */
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px;margin:16px 0}
.deal{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh1);transition:.22s;overflow:hidden;display:flex;flex-direction:column}
.deal:hover{transform:translateY(-4px);box-shadow:var(--sh3);border-color:var(--line2)}
.deal.top{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box}
.deal .ribbon{position:absolute;top:14px;right:-34px;transform:rotate(38deg);background:linear-gradient(115deg,#e11d48,#db2777);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.1em;padding:5px 40px;text-transform:uppercase;box-shadow:0 3px 10px rgba(225,29,72,.35);z-index:2}
.deal .dhead{padding:17px 19px 0;display:flex;align-items:flex-start;gap:12px}
.deal .dflag{font-size:1.9rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(11,18,32,.15))}
.deal .dcity{font-size:1.14rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.deal .dcountry{font-size:.68rem;color:var(--mut2);font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.deal .dprice{display:flex;align-items:baseline;gap:9px;padding:13px 19px 0;flex-wrap:wrap}
.deal .dp{font-size:2.05rem;font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;line-height:1.05}
.deal .dper{font-size:.72rem;color:var(--mut);font-weight:700}
.deal .dsave{margin:10px 19px 0;display:flex;align-items:center;gap:7px;background:var(--goodbg);border:1px solid var(--goodln);color:#047857;border-radius:12px;padding:8px 12px;font-size:.76rem;font-weight:800}
.deal .dmeter{margin:13px 19px 0}
.deal .dmlabel{display:flex;justify-content:space-between;font-size:.64rem;font-weight:700;color:var(--mut);margin-bottom:5px}
.deal .dmtrack{height:9px;border-radius:6px;background:#edf1f8;overflow:hidden;border:1px solid var(--line)}
.deal .dmfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#059669,#10b981);transition:width .8s cubic-bezier(.22,1,.36,1)}
.deal .dmfill.warn{background:linear-gradient(90deg,#f59e0b,#f97316)}
.deal .ddates{font-size:.78rem;color:var(--mut);font-weight:600;margin:12px 19px 0;line-height:1.55}
.deal .dchips{padding:9px 19px 0;display:flex;gap:6px;flex-wrap:wrap}
.deal .dcta{display:flex;gap:8px;padding:14px 19px 17px;margin-top:auto;flex-wrap:wrap}
.deal .dcta .btn{flex:1;min-width:120px}
.deal .dmore{border-top:1px dashed var(--line2);margin:0 19px;padding:9px 0 0;font-size:.72rem;color:var(--mut)}
.deal .dmore a{color:var(--brand);font-weight:700;text-decoration:none}
.deal .dmore a:hover{text-decoration:underline}
.deal .dpkg{margin:9px 19px 0;font-size:.74rem;color:var(--mut);line-height:1.6;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.deal .dpkg a{color:var(--brand);font-weight:700;text-decoration:none;white-space:nowrap}
.deal .dpkg a:hover{text-decoration:underline}
/* ---------- tablas ---------- */
.tbl{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:var(--r);margin:13px 0;background:#fff;overscroll-behavior:contain;box-shadow:var(--sh1)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;min-width:560px}
th{background:#f7f9fd;text-align:left;padding:11px 14px;position:sticky;top:0;z-index:2;font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;color:#5a6885;font-weight:800;box-shadow:inset 0 -1px 0 var(--line)}
td{padding:10px 14px;border-top:1px solid #eef2f9;vertical-align:top;color:#1c2740}
tr{transition:background .15s}
tr:hover td{background:#f4f8ff}
.p{color:var(--good);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.b{color:var(--mut);font-size:.73rem}
a{color:#1d4ed8;text-decoration:none}
a:hover{text-decoration:underline}
/* ---------- inputs ---------- */
input.filt,input[type=email]{width:100%;margin:10px 0;background:#fff;border:1px solid var(--line2);border-radius:13px;padding:12px 15px;color:var(--ink);font:inherit;font-size:.86rem;transition:.2s}
input.filt:focus,input[type=email]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
input::placeholder{color:var(--mut2)}
/* ---------- calendarios ---------- */
.cals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.month{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh1)}
.mtitle{font-weight:800;font-size:.94rem;margin-bottom:10px;letter-spacing:-.01em}
.dows,.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dows span{text-align:center;font-size:.6rem;color:var(--mut2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 0}
.cday{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;padding:5px 2px 4px;text-align:center;transition:transform .15s,box-shadow .15s,border-color .15s;min-height:47px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.cday:hover:not(:disabled){transform:translateY(-2px);border-color:#94b8d8;box-shadow:0 4px 12px rgba(11,18,32,.12)}
.cday:disabled{opacity:.35;cursor:default;background:var(--soft)}
.cday.sel{outline:2px solid var(--brand);outline-offset:1px;box-shadow:0 0 0 4px rgba(79,70,229,.14)}
.cday .dn{font-size:.72rem;font-weight:700;color:#31405e}
.cday .pr{font-size:.62rem;font-weight:800;font-variant-numeric:tabular-nums}
.cempty{min-height:47px}
.legend{display:flex;align-items:center;gap:9px;font-size:.68rem;color:var(--mut);margin:10px 0;flex-wrap:wrap}
.legend .lbar{width:190px;height:8px;border-radius:4px;background:linear-gradient(90deg,#10b981,#fbbf24,#f43f5e)}
/* ---------- podium ---------- */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:19px;box-shadow:var(--sh1);transition:.2s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh2)}
.pcard .medal{font-size:1.35rem}
.pcard .air{font-weight:800;font-size:1.02rem;margin:6px 0 1px;letter-spacing:-.015em}
.pcard .pri{font-size:2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;line-height:1.1;margin:5px 0;letter-spacing:-.035em}
.pcard.first{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:var(--sh2)}
.pcard .dt{font-size:.76rem;color:var(--mut);line-height:1.55}
.pcard .btn{margin-top:auto}
.pcard .btn+.btn{margin-top:8px}
/* ---------- ranking rows ---------- */
.rlist{margin:10px 0}
.rrow{display:flex;gap:14px;align-items:center;padding:14px 17px;margin:9px 0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);flex-wrap:wrap;transition:.18s}
.rrow:hover{border-color:var(--line2);transform:translateX(3px)}
.rrow .rk{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--soft);border:1px solid var(--line);color:#31405e;flex:0 0 auto}
.rrow .info{flex:1;min-width:180px}
.rrow .info b{font-size:.92rem;letter-spacing:-.01em}
.rrow .rp{font-size:1.2rem;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.rrow.over .rp{color:var(--bad)}
/* ---------- barras comparativas ---------- */
.bars{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh1)}
.brow{display:grid;grid-template-columns:172px 1fr 140px;gap:12px;align-items:center;margin:11px 0}
.bname{font-size:.81rem;font-weight:700;line-height:1.3}
.bname .b{display:block;font-weight:600}
.btrack{height:26px;border-radius:9px;background:#edf1f8;overflow:hidden;border:1px solid var(--line)}
.bfill{height:100%;border-radius:9px;background:linear-gradient(90deg,#f43f5e,#fb923c);transition:width .7s cubic-bezier(.22,1,.36,1)}
.bfill.good{background:linear-gradient(90deg,#059669,#0d9488)}
.bval{font-size:.82rem;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--good)}
.bval .d{display:block;font-size:.67rem;font-weight:700;color:var(--mut)}
.bval .d.up{color:var(--warn)}
.bval .d.bad{color:var(--bad)}
.bval.base{color:var(--ink)}
/* ---------- acordeones ---------- */
details.acc{border:1px solid var(--line);border-radius:16px;background:#fff;margin:11px 0;overflow:hidden;box-shadow:var(--sh1)}
details.acc summary{cursor:pointer;padding:14px 17px;font-size:.84rem;font-weight:700;color:var(--ink);list-style:none;display:flex;gap:9px;align-items:center;user-select:none;transition:background .15s}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:'▸';color:var(--brand);transition:transform .2s;font-size:.9rem}
details.acc[open] summary::before{transform:rotate(90deg)}
details.acc summary:hover{background:var(--soft)}
details.acc .inner{padding:0 14px 14px}
/* ---------- ventana cards ---------- */
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:var(--sh1)}
.wtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wtop .wdate{font-weight:800;font-size:.94rem;letter-spacing:-.01em}
.wtop .wpri{margin-left:auto;font-size:1.42rem;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.wrows{margin-top:10px;display:grid;gap:6px}
.wrow{display:flex;gap:10px;align-items:center;font-size:.78rem;padding:8px 12px;border-radius:11px;background:var(--soft);border:1px solid #edf1f8;flex-wrap:wrap;color:#31405e}
.wrow .wa{font-weight:700;min-width:110px}
.wrow .wp{margin-left:auto;color:var(--good);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ---------- timeline alertas ---------- */
.tl{position:relative;margin:16px 0;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(#6366f1,rgba(99,102,241,.08));border-radius:1px}
.tlev{position:relative;margin:0 0 13px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 16px;box-shadow:var(--sh1)}
.tlev::before{content:'';position:absolute;left:-23px;top:18px;width:10px;height:10px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.tlev .pct{font-size:1.45rem;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tlev .ser{font-weight:800;font-size:.86rem}
/* ---------- cupones ---------- */
.code{display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2ff;border:1.5px dashed #a5b4fc;color:#3730a3;border-radius:11px;padding:6px 12px;font-size:.82rem;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:.15s;border-style:dashed}
.code:hover{background:#e0e7ff}
.code .cpy{font-family:inherit;font-size:.6rem;background:#4f46e5;color:#fff;border-radius:6px;padding:2px 7px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
/* ---------- regla de precios (playas) ---------- */
.ruler{margin:16px 0 8px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:56px 22px 12px;box-shadow:var(--sh1)}
.rtrack{position:relative;height:148px}
.rtrack::before{content:'';position:absolute;left:0;right:0;top:45px;height:3px;border-radius:2px;background:linear-gradient(90deg,#34d399,#fbbf24 55%,#fb7185)}
.rbud{position:absolute;top:2px;bottom:26px;border-left:2px dashed #e11d48;z-index:2}
.rbud span{position:absolute;top:-28px;left:-38px;font-size:.64rem;font-weight:800;color:#be123c;white-space:nowrap;background:#fff1f2;border:1px solid #fecdd3;border-radius:999px;padding:2px 9px}
.rdot{position:absolute;top:38px;width:16px;height:16px;transform:translateX(-50%);cursor:default;z-index:1}
.rdot::before{content:'';position:absolute;inset:1px;border-radius:50%;background:#f43f5e;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(11,18,32,.3)}
.rdot.ok::before{background:#059669}
.rdot .rf{position:absolute;left:50%;transform:translateX(-50%);top:-25px;font-size:.95rem;line-height:1}
.rdot .rl{position:absolute;left:50%;transform:translateX(-50%);top:17px;font-size:.55rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:#64748b}
.rdot.ok .rl{color:#047857}
.rdot.alt .rf{top:-46px}.rdot.alt .rl{top:33px}
.rdot.alt2 .rf{top:-67px}.rdot.alt2 .rl{top:49px}
.rdot.alt3 .rf{top:-88px}.rdot.alt3 .rl{top:65px}
.raxis{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;color:var(--mut2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;border-top:1px solid #eef2f8;padding-top:8px}
/* ---------- fuentes ---------- */
.srcpill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2.5px 10px;font-size:.64rem;font-weight:800;letter-spacing:.04em}
.srcpill.fresh{background:var(--goodbg);color:#047857;border:1px solid var(--goodln)}
.srcpill.stale{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnln)}
footer{max-width:1160px;margin:0 auto;padding:22px 18px 46px;color:var(--mut2);font-size:.72rem;text-align:center;line-height:1.7;border-top:1px solid var(--line)}
footer a{color:var(--mut);font-weight:600}
.err{margin:60px auto;max-width:560px;background:var(--warnbg);border:1px solid var(--warnln);color:#92400e;border-radius:var(--r);padding:22px;font-size:.9rem;text-align:center}
.flyg{offset-path:path('M30,64 Q300,-4 570,64');offset-rotate:0deg;animation:fly 7s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
@media(max-width:920px){
 .hgrid{grid-template-columns:1fr}
 .hside{border-left:0;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
 .kpi{flex:1;min-width:200px}
}
@media(max-width:720px){
 .hmain{padding:22px 18px}
 .hside{padding:16px}
 .cals{grid-template-columns:1fr}
 .podium{grid-template-columns:1fr}
 .deals{grid-template-columns:1fr}
 .brow{grid-template-columns:118px 1fr 104px}
 .cday{min-height:43px}
 .cday .pr{font-size:.57rem}
 table{min-width:520px;font-size:.75rem}
 th,td{padding:8px 10px}
 main{padding:14px 10px 64px}
 .ruler{padding:34px 12px 8px}
 .rbud span{left:-30px}
}
</style></head><body>
<div id="app">
 <div v-if="fatal" class="err">No se pudo cargar el motor de la interfaz (Vue). Revisa tu conexión y recarga.</div>
 <template v-else>
 <header>
  <div class="hwrap">
   <div class="htop">

     <div>
      <div class="hbrand"><span class="g">RADAR RÍO</span> · SCL ⇄ GIG</div>
      <div class="hsub">Verano 2027 · ene–feb · regreso ≤ 23-feb · viaje ≥ 9 noches</div>
     </div>
    </div>
    <span class="livepill"><i></i>En vivo</span>
    <span class="hstat">ciclo {{DATA?.cycle||0}} · {{hace(DATA?.updated)}}</span>
   </div>
   <div class="paxrow">
    <span class="paxnote">Pasajeros</span>
    <div class="seg"><button v-for="n in PAXOPTS" :key="n" :class="{on:pax===n}" @click="pax=n">{{n}}</button></div>
    <span class="paxnote" v-if="campeon">· grupo ≈ <b>{{fmt(campeon.total*pax)}}</b></span>
    <span class="paxnote" style="margin-left:auto" v-if="DATA?.updated"><span class="spin" style="color:#10b981"></span>precios vivos · refresco ~5 min</span>
   </div>
  </div>
 </header>
 <nav><div class="nwrap">
  <button v-for="(t,i) in TABS" :key="i" :class="{on:cur===i}" @click="cur=i" v-html="t"></button>
 </div></nav>
 <main>
  <!-- 0 HOY -->
  <section :class="{on:cur===0}">
   <div class="ticker" v-if="ticker.length"><div class="track">
    <template v-for="n in 2"><span class="tk" v-for="t in ticker" :key="n+t.k">{{t.k}} <b>{{fmt(t.v)}}</b></span></template>
   </div></div>
   <div class="hero" v-if="campeon">
    <div class="hgrid">
     <div class="hmain">
      <div class="kick">Mejor precio encontrado · ida y vuelta por persona</div>
      <div class="bestprice">{{fmt(campeon.total)}}</div>
      <div class="per">{{pax}} {{pax===1?'pasajero':'pasajeros'}} ≈ <b style="color:var(--ink)">{{fmt(campeon.total*pax)}}</b> en total</div>
      <svg viewBox="0 0 600 84" aria-hidden="true" style="width:100%;max-width:520px;margin-top:14px">
       <defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
       <path d="M30,64 Q300,-4 570,64" fill="none" stroke="url(#ga)" stroke-width="2" stroke-dasharray="6 7" opacity=".8"/>
       <circle cx="30" cy="64" r="4.5" fill="#4f46e5"/><circle cx="570" cy="64" r="4.5" fill="#0891b2"/>
       <text x="12" y="81" fill="#8894ad" font-size="12" font-weight="700">SCL</text><text x="548" y="81" fill="#8894ad" font-size="12" font-weight="700">GIG</text>
       <g class="flyg"><text font-size="15">✈️</text></g>
      </svg>
      <div class="bestroute">{{campeon.titulo}}</div>
      <div class="bestdates">{{dw(campeon.ida)}} {{campeon.ida}} → {{dw(campeon.vuelta)}} {{campeon.vuelta}} · {{campeon.noches}} noches</div>

       <a class="btn ghost" href="#" @click.prevent="cur=1">Comparar fechas</a></div>
     </div>
     <div class="hside">
      <div class="kpi" @click="cur=1" role="button" tabindex="0">
       <div class="ki b">📅</div>

      </div>
      <div class="kpi" v-if="mezclas" @click="cur=3" role="button" tabindex="0">

    </div>
   </div>

    </div>
   </div>

    </table></div>
    <div class="b">Solo fuentes vivas: APIs oficiales + Cocha real + Skiplagged + Falabella/Despegar cuando su lectura es fresca (&lt;24 h). La mezcla entre compañías son compras separadas (sin protección de conexión).</div>

  </section>

  <section :class="{on:cur===1}">

   </div>
   <div class="note info" v-if="cuponesActivos.length"><span class="ic">🎟️</span><span><b>Combina tu reserva:</b> hay <b>{{cuponesActivos.length}} cupones y promos vigentes</b> para hoteles y paquetes de estos destinos (Falabella 2X, Cocha y más). <a href="#" @click.prevent="cur=7" style="font-weight:800">Ver cupones →</a></span></div>
  </section>
  <!-- 2 CALENDARIO -->
  <section :class="{on:cur===2}">
   <div class="note info"><span class="ic">📅</span><span><b>El precio más bajo de cada día</b> (ida o vuelta, según el modo), comparando JetSMART + LATAM + Skiplagged a la vez. Toca un día para ver quién lo vende y con qué vuelo. Los colores van de <b style="color:#059669">barato</b> a <b style="color:#e11d48">caro</b>.</span></div>

   <div class="legend"><span>{{kfmt(calRange.lo)}}</span><div class="lbar"></div><span>{{kfmt(calRange.hi)}}</span><span class="b">· mínimo del día entre JetSMART+LATAM+Skiplagged · atenuado = sin precio o no calza (≥9 noches, regreso ≤23-feb)</span></div>
   <div class="cals">
    <div class="month" v-for="mm in [{t:'Enero 2027',c:calCells.ene},{t:'Febrero 2027',c:calCells.feb}]" :key="mm.t">

     <div class="dows"><span>lu</span><span>ma</span><span>mi</span><span>ju</span><span>vi</span><span>sá</span><span>do</span></div>

      </template>

 data:()=>({DATA:null,SUBS:[],mail:'',cur:0,fi:'',fv:'',fatal:false,selDate:'',calMode:'ida',copied:'',

 computed:{
  F(){return this.DATA?.fuentes||{}},
  ticker(){const t=[];const cp=this.combosPax[0];if(cp)t.push({k:'JetSMART oficial',v:cp.clp});const sp=this.sky.pairs?.[0];if(sp)t.push({k:'SKY oficial',v:sp.clp});const lc=this.lat.combos?.[0];if(lc)t.push({k:'LATAM oficial',v:lc.clp});const cv=(this.cocha.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];if(cv&&this.esFresca(this.cocha.ts))t.push({k:'Cocha real',v:cv.min_clp});const sv=(this.sk.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];if(sv&&this.esFresca(this.sk.ts))t.push({k:'Skiplagged global',v:sv.min_clp});const mx=this.mezclas;if(mx)t.push({k:'Mezcla compañías',v:mx.total});const mp=this.ofertas[0];if(mp)t.push({k:'Playa alternativa',v:mp.mejor.clp});return t},
  calOut(){const m={};const put=(f,clp,src)=>{if(!(clp>0))return;if(!/^2027-0[12]-/.test(f))return;if(!m[f]||clp<m[f].min)m[f]={min:clp,src};};
   for(const x of this.js.idas||[])put(x.fecha,x.clp,'JetSMART');

   return m},
  calIn(){const m={};const put=(f,clp,src)=>{if(!(clp>0))return;if(!/^2027-0[12]-/.test(f))return;if(!m[f]||clp<m[f].min)m[f]={min:clp,src};};
   for(const x of this.js.vueltas||[])put(x.fecha,x.clp,'JetSMART');
   for(const x of this.lat.dias_in||[])put(x.fecha,x.clp,'LATAM');
   if(this.esFresca(this.sk.ts))for(const v of this.sk.ventanas||[])for(const r of v.ow_in||[])put(r.fecha,r.clp,'Skiplagged');
   return m},
  calRange(){const vals=[...Object.values(this.calOut),...Object.values(this.calIn)].map(x=>x.min).filter(v=>v>0);return vals.length?{lo:Math.min(...vals),hi:Math.max(...vals)}:{lo:0,hi:1}},
  calCells(){const mk=(y,m)=>{const pad=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const cells=[];for(let i=0;i<pad;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push({d,fecha:y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')});return cells;};
   return {ene:mk(2027,0),feb:mk(2027,1)}},
  selInfo(){const f=this.selDate;if(!f)return null;const ida=this.calMode==='ida';const opts=[];
   if(ida){
    for(const x of (this.js.idas||[]).filter(z=>z.fecha===f).sort((a,b)=>a.clp-b.clp).slice(0,4))opts.push({src:'JetSMART',det:x.vuelo+' · sale '+x.hora,clp:x.clp,link:this.jsOW(f,'SCL','GIG'),cls:''});
    const l=(this.lat.dias_out||[]).find(z=>z.fecha===f);if(l&&l.clp)opts.push({src:'LATAM',det:l.directo?'vuelo directo':'con escala',clp:l.clp,link:'https://www.latamairlines.com/cl/es',cls:'ink'});
    if(this.esFresca(this.sk.ts))for(const v of this.sk.ventanas||[])for(const r of (v.ow_out||[]).filter(z=>z.fecha===f).sort((a,b)=>a.clp-b.clp).slice(0,3))opts.push({src:'Skiplagged · '+r.aerolinea,det:r.det,clp:r.clp,link:v.link,cls:'ghost'});
   }else{
    for(const x of (this.js.vueltas||[]).filter(z=>z.fecha===f).sort((a,b)=>a.clp-b.clp).slice(0,4))opts.push({src:'JetSMART',det:x.vuelo+' · sale '+x.hora,clp:x.clp,link:this.jsOW(f,'GIG','SCL'),cls:''});
    const l=(this.lat.dias_in||[]).find(z=>z.fecha===f);if(l&&l.clp)opts.push({src:'LATAM',det:l.directo?'vuelo directo':'con escala',clp:l.clp,link:'https://www.latamairlines.com/cl/es',cls:'ink'});
    if(this.esFresca(this.sk.ts))for(const v of this.sk.ventanas||[])for(const r of (v.ow_in||[]).filter(z=>z.fecha===f).sort((a,b)=>a.clp-b.clp).slice(0,3))opts.push({src:'Skiplagged · '+r.aerolinea,det:r.det,clp:r.clp,link:v.link,cls:'ghost'});
   }
   opts.sort((a,b)=>a.clp-b.clp);
   const map=ida?this.calIn:this.calOut;const sugg=[];
   for(const g of Object.keys(map)){
    const n=ida?this.noches(f,g):this.noches(g,f);
    if(n<9)continue;
    const ret=ida?g:f;if(ret>'2027-02-23')continue;
    sugg.push({fecha:g,min:map[g].min,src:map[g].src,noches:n,ida:ida?f:g,vuelta:ida?g:f});
   }
   sugg.sort((a,b)=>a.min-b.min);
   return {opts:opts.slice(0,8),sugg:sugg.slice(0,6)}},
  brasilBars(){const b=this.cocha.brasil||[];if(!b.length)return[];const mx=Math.max(...b.map(x=>x.min_clp));return b.map(x=>({...x,w:Math.max(6,Math.round(x.min_clp/mx*100)),good:(x.delta_pct??99)<=20}))},

  playasAxis(){const r=this.playasRows;const budget=this.playas.budget||500000;if(!r.length)return null;

  js(){return this.F.jetsmart||{}},
  sky(){return this.F.sky||{}},
  lat(){return this.F.latam||{}},
  sk(){return this.F.skiplagged||{}},
  fal(){return this.F.falabella||{}},

  cochaMejor(){return (this.cocha.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0]||{}},
  rtPorAerolinea(){
   const por={};
   const add=(cod,airline,clp,ida,vuelta,det,fuente,link,cls)=>{
    if(!(clp>0)||!ida||!vuelta)return;

   };
   const cp=this.combosPax[0];
   if(cp) add('JA','JetSMART',cp.clp,cp.ida,cp.vuelta,(cp.v_ida||'')+' / '+(cp.v_vue||'')+' · directo','API oficial',this.jsRT(cp.ida,cp.vuelta),'');
   const sp=this.sky.pairs?.[0];
   if(sp) add('H2','SKY Airline',sp.clp,sp.ida,sp.vuelta,'RT directo oficial','API oficial',this.skyLink(sp),'amber');
   const lc=this.lat.combos?.[0];
   if(lc) add('LA','LATAM',lc.clp,lc.ida,lc.vuelta,'suma de tramos directos','API oficial','https://www.latamairlines.com/cl/es','ink');
   if(this.esFresca(this.cocha.ts)) for(const v of this.cocha.ventanas||[]) for(const r of v.resultados||[])
    add(r.cod,r.aerolinea,r.clp,v.ida,v.vuelta,r.det+(r.escalas===0?' · directo':''),'Cocha real',v.link,'good');
   if(this.esFresca(this.sk.ts)) for(const v of this.sk.ventanas||[]) for(const r of v.resultados||[])

   if(this.esFresca(this.fal.ts)&&this.falBest){const fb=this.falBest;
    add('FAL','Viajes Falabella',fb.tot,fb.ida.fecha,fb.vuelta.fecha,'suma de mínimos publicados','OTA verificada',this.falOW(fb.ida.sentido,fb.ida.fecha),'amber');}

    if(i.cod===v.cod) continue;
    const n=this.noches(i.fecha,v.fecha);
    if(n<9||v.fecha>'2027-02-23') continue;
    const t=i.clp+v.clp;
    if(!best||t<best.total) best={total:t,ida:i,vuelta:v,noches:n};
   }
   return best;
  },
  campeon(){
   const rt=this.rtPorAerolinea[0],mx=this.mezclas,c=[];
   if(rt) c.push({total:rt.clp,ida:rt.ida,vuelta:rt.vuelta,noches:this.noches(rt.ida,rt.vuelta),tipo:'rt',ref:rt,
    titulo:'✈️ Ida y vuelta '+rt.airline+' ('+rt.fuente+')',
    botones:[{texto:'Comprar '+rt.airline+' ↗',href:rt.link,cls:rt.cls}]});
   if(mx) c.push({total:mx.total,ida:mx.ida.fecha,vuelta:mx.vuelta.fecha,noches:mx.noches,tipo:'mix',ref:mx,
    titulo:'🔀 Ida '+this.nomAer(mx.ida.cod)+' + vuelta '+this.nomAer(mx.vuelta.cod)+' (compañías distintas)',
    botones:[{texto:'Comprar ida ↗',href:mx.ida.link,cls:mx.ida.cls},{texto:'Comprar vuelta ↗',href:mx.vuelta.link,cls:mx.vuelta.cls}]});
   if(!c.length) return null;
   return c.sort((a,b)=>a.total-b.total)[0];
  },
  consol(){const r=[];
   const sp=this.sky.pairs?.[0]; if(sp) r.push({emp:'SKY Airline',tipo:'API oficial · RT directo',det:'Mínimo oficial ida y vuelta',ida:sp.ida,vuelta:sp.vuelta,pp:sp.clp,link:this.skyLink(sp),cls:'amber'});
   const cp=this.combosPax[0]; if(cp) r.push({emp:'JetSMART',tipo:'API oficial · RT directo',det:(cp.v_ida||'')+' / '+(cp.v_vue||''),ida:cp.ida,vuelta:cp.vuelta,pp:cp.clp,link:this.jsRT(cp.ida,cp.vuelta),cls:''});
   const lc=this.lat.combos?.[0]; if(lc) r.push({emp:'LATAM',tipo:'API oficial · suma idas+vueltas directas',det:'Mínimo oficial ida y vuelta',ida:lc.ida,vuelta:lc.vuelta,pp:lc.clp,link:'https://www.latamairlines.com/cl/es',cls:'ink'});
   const cv=(this.cocha.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];
   if(cv&&this.esFresca(this.cocha.ts)) r.push({emp:'Cocha',tipo:'OTA · cotización real API',det:'Mejor cotización multi-aerolínea',ida:cv.ida,vuelta:cv.vuelta,pp:cv.min_clp,link:cv.link,cls:'good'});
   const sv=(this.sk.ventanas||[]).slice().sort((a,b)=>a.min_clp-b.min_clp)[0];
   if(sv&&this.esFresca(this.sk.ts)) r.push({emp:'Skiplagged',tipo:'Metasearch · 10+ aerolíneas',det:'Mejor RT global (CLP vía dólar observado)',ida:sv.ida,vuelta:sv.vuelta,pp:sv.min_clp,link:sv.link,cls:''});
   const fb=this.falBest; if(fb&&this.esFresca(this.fal.ts)) r.push({emp:'Viajes Falabella',tipo:'OTA · referencia del día',det:'Mejor ida + mejor vuelta publicadas',ida:fb.ida.fecha,vuelta:fb.vuelta.fecha,pp:fb.tot,link:this.falOW(fb.ida.sentido,fb.ida.fecha),cls:'amber'});
   const db=this.desBest; if(db&&this.esFresca(this.des.ts)) r.push({emp:'Despegar',tipo:'OTA · referencia del día',det:'Mejor ida + mejor vuelta publicadas',ida:db.ida.fecha,vuelta:db.vuelta.fecha,pp:db.tot,link:this.desOW(db.ida.sentido,db.ida.fecha),cls:'rose'});
   return r.sort((a,b)=>a.pp-b.pp)},
  desBest(){const ds=this.des.dias||[];const i=ds.filter(d=>d.sentido==='SCL-GIG'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];const v=ds.filter(d=>d.sentido==='GIG-SCL'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];return i&&v?{ida:i,vuelta:v,tot:i.min_clp+v.min_clp}:null},
  falBest(){const ds=this.fal.dias||[];const i=ds.filter(d=>d.sentido==='SCL-RIO'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];const v=ds.filter(d=>d.sentido==='RIO-SCL'&&d.min_clp).sort((a,b)=>a.min_clp-b.min_clp)[0];return i&&v?{ida:i,vuelta:v,tot:i.min_clp+v.min_clp}:null},
  combosPax(){const m=this.js.combos_by_pax||{};return m[String(this.pax)]||this.js.combos||[]},
  fI(){const o=this.fi.trim();return [...(this.js.idas||[])].filter(x=>!o||x.fecha.includes(o)).sort((a,b)=>a.clp-b.clp)},
  fV(){const o=this.fv.trim();return [...(this.js.vueltas||[])].filter(x=>!o||x.fecha.includes(o)).sort((a,b)=>a.clp-b.clp)},
  latRows(){const a=this.lat.dias_out||[],b=this.lat.dias_in||[],n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push({a:a[i],b:b[i]});return r}
 },
 methods:{
  dw(d){if(!d)return'';const[p,m,dd]=d.split('-').map(Number);return DIA[new Date(p,m-1,dd).getDay()]},
  fmt(n){return '$ '+Math.round(n).toLocaleString('es-CL')},
  hace(ts){if(!ts)return'—';const t=Date.parse(String(ts).replace(' ','T')+'Z');if(!isFinite(t))return ts;const m=Math.round((Date.now()-t)/60000);if(m<1)return'hace instantes';if(m<60)return'hace '+m+' min';const h=Math.round(m/60);if(h<24)return'hace '+h+' h';return'hace '+Math.round(h/24)+' d'},
  ciudadCorta(d){return ((d.ciudad||'').split('·')[0]).trim()},
  async copyCode(c){try{await navigator.clipboard.writeText(c);this.copied=c;setTimeout(()=>{if(this.copied===c)this.copied=''},1800)}catch(e){}},
  jsOW(f,o,dd){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=false&cur=CLP&culture=es-CL&dd1=${f}&o1=${o}&d1=${dd}`},
  jsRT(i,v){return `https://booking.jetsmart.com/Flight/InternalSelect?c=true&mon=true&r=true&cur=CLP&culture=es-CL&dd1=${i}&o1=SCL&d1=GIG&dd2=${v}`},
  skyLink(s){const m={1:[1,0],2:[2,0],4:[4,0],5:[4,1],9:[8,1]}[this.pax]||[this.pax,0];return `https://initial-sale.skyairline.com/es/chile?origin=SCL&destination=GIG&departureDate=${s.ida}&arrivalDate=${s.vuelta}&flightType=RT&ADT=${m[0]}`+(m[1]?`&CHD=${m[1]}`:'')},
  subUrl(acc){const repo=location.pathname.includes('qwen_vuelos_rio')?'qwen_vuelos_rio':'vuelos-rio-live';return `https://github.com/Xacox01/${repo}/issues/new?title=${encodeURIComponent(acc+' '+this.mail.trim())}&body=${encodeURIComponent('Solicitud automatica desde el dashboard vuelos-rio-live.')}`},
  dayMin(f){const x=this.calMode==='ida'?this.calOut[f]:this.calIn[f];return x&&x.min>0?x.min:0},
  dayOk(f){if(!(this.dayMin(f)>0))return false;if(this.calMode==='vuelta')return f<='2027-02-23';return f<='2027-02-14'},
  heat(p){const r=this.calRange;if(!(p>0))return{};const t=Math.min(1,Math.max(0,(p-r.lo)/((r.hi-r.lo)||1)));const h=Math.round(158-158*t);return{background:'hsla('+h+',68%,50%,.18)',borderColor:'hsla('+h+',68%,52%,.5)'}},
  heatTxt(p){const r=this.calRange;if(!(p>0))return{};const t=Math.min(1,Math.max(0,(p-r.lo)/((r.hi-r.lo)||1)));const h=Math.round(158-158*t);return{color:'hsl('+h+',72%,28%)'}},
  kfmt(n){return n>=1e6?'$'+(n/1e6).toFixed(1)+'M':'$'+Math.round(n/1000)+'K'},
  rtLinks(i,v){return [{label:'JetSMART ↗',href:this.jsRT(i,v),cls:''},{label:'SKY ↗',href:this.skyLink({ida:i,vuelta:v}),cls:'amber'},{label:'Cocha ↗',href:'https://www.cocha.com/resultado/vuelos/SCL/GIG/'+i+'/1/Y?origin2=GIG&destination2=SCL&date2='+v,cls:'good'},{label:'Skiplagged ↗',href:'https://skiplagged.com/flights/SCL/GIG/'+i+'/'+v+'?sort=cost',cls:'ghost'}]},
  alojaB(d){return 'https://www.booking.com/searchresults.es.html?ss='+encodeURIComponent(this.ciudadCorta(d)+', '+d.pais)+'&checkin='+d.mejor.ida+'&checkout='+d.mejor.vuelta+'&group_adults='+this.pax+'&no_rooms='+(Math.ceil(this.pax/2))},
  alojaA(d){return 'https://www.airbnb.com/s/'+encodeURIComponent(this.ciudadCorta(d))+'/homes?checkin='+d.mejor.ida+'&checkout='+d.mejor.vuelta+'&adults='+this.pax},
  noches(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)},
  nomAer(c){return NOMS[c]||c},
  esFresca(ts){if(!ts)return false;const t=Date.parse(String(ts).replace(' ','T')+'Z');return isFinite(t)&&(Date.now()-t)<864e5},
  maskMail(s){const p=s.split('@');return (p[0]||'').slice(0,2)+'•••@'+(p[1]||'')},
  falOW(s,f){const[O,D]=s.split('-');return `https://www.viajesfalabella.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  desOW(s,f){const[O,D]=s.split('-');return `https://www.despegar.cl/shop/flights/results/oneway/${O}/${D}/${f}/1/0/0`},
  async poll(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});this.DATA=await r.json()}catch(e){console.error(e)}try{const s=await fetch('subscribers.json?t='+Date.now(),{cache:'no-store'});if(s.ok)this.SUBS=await s.json()}catch(e){}},
 },
 async mounted(){await this.poll();setInterval(()=>this.poll(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.poll()})}
}).mount('#app');
}
</script></body></html>
