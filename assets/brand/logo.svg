<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Radar de vuelos">
  <!-- LOGO OFICIAL · Radar de vuelos
       Concepto universal sin texto: radar (escaneo en vivo) + avión ascendente (vuelos, conveniencia) + señal (alertas de precio).
       Paleta: azul #0A4FD9 (confianza) · naranja #FF690F (ahorro/alerta) · blanco (claridad). -->
  <circle cx="256" cy="256" r="236" fill="#0A4FD9"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>
  <!-- señal del radar: dos arcos naranjas en el cuadrante NE -->
  <path d="M 288.4 103.4 A 156 156 0 0 1 405.9 213.0" fill="none" stroke="#FF690F" stroke-width="26" stroke-linecap="round"/>
  <path d="M 313.9 66.7 A 198 198 0 0 1 445.3 198.1" fill="none" stroke="#FF690F" stroke-width="26" stroke-linecap="round"/>
  <circle cx="414.4" cy="97.6" r="17" fill="#FF690F"/>
  <!-- avión ascendente a 45° -->
  <g transform="translate(250 268) rotate(45) scale(14.2) translate(-12 -12)">
    <path fill="#FFFFFF" d="M21.5,15.5v-2l-8,-5V3.38C13.5,2.61,12.89,2,12.12,2S10.75,2.61,10.75,3.38v5.25l-8,5v2l8,-2.5v5.5l-2.25,1.69V21.5L12,20.5l3.5,1v-1.81L13.25,18v-5.5L21.5,15.5z"/>
  </g>
</svg>
